<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusNet — Ficha Académica del Integrante</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
/* ================================================================
   CAMPUSNET — PLATAFORMA ACADÉMICA VIBRANTE, MODERNA Y LUMINOSA
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --bg-page:        #0B1120;
  --bg-panel:       #131D33;
  --bg-card:        rgba(23, 34, 59, 0.88);
  --bg-card-hover:  rgba(31, 46, 78, 0.96);
  --bg-input:       #192542;
  --bg-hover:       #24345B;
  --bg-modal:       #121B30;

  --indigo:         #6366F1;
  --indigo-light:   #818CF8;
  --purple:         #8B5CF6;
  --pink:           #EC4899;
  --cyan:           #06B6D4;
  --cyan-light:     #67E8F9;
  --emerald:        #10B981;
  --emerald-light:  #34D399;
  --amber:          #F59E0B;
  --amber-light:    #FBBF24;
  --rose:           #F43F5E;

  --text-1:         #FFFFFF;
  --text-2:         #E2E8F0;
  --text-3:         #94A3B8;

  --border:         rgba(255, 255, 255, 0.14);
  --border-strong:  rgba(255, 255, 255, 0.28);
  --border-glow:    rgba(99, 102, 241, 0.55);

  --shadow-sm:      0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-md:      0 8px 26px rgba(0, 0, 0, 0.45);
  --shadow-lg:      0 18px 50px rgba(0, 0, 0, 0.6);
  --shadow-glow:    0 0 25px rgba(99, 102, 241, 0.4);

  --radius-sm:      10px;
  --radius-md:      14px;
  --radius-lg:      20px;
  --radius-xl:      26px;

  --navbar-h:       68px;
  --transition:     all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-page);
  background-image: 
    radial-gradient(circle at 12% 10%, rgba(99, 102, 241, 0.35) 0%, transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(6, 182, 212, 0.32) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.22) 0%, transparent 50%),
    radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.28) 0%, transparent 45%),
    radial-gradient(circle at 15% 90%, rgba(16, 185, 129, 0.28) 0%, transparent 45%);
  background-attachment: fixed;
  background-size: cover;
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
  overflow-x: hidden;
}

a { color: var(--cyan); text-decoration: none; transition: var(--transition); }
a:hover { text-decoration: none; color: var(--cyan-light); }
button { cursor: pointer; border: none; outline: none; font-family: inherit; }
input, textarea, select { font-family: inherit; }
img { max-width: 100%; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-panel); }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--indigo); }

/* ── Animaciones ─────────────────────────────────────────────────── */
@keyframes floatSlow {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
  50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.6); }
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.96) translateY(12px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes rainbowShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── Navbar ──────────────────────────────────────────────────────── */
.navbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--navbar-h);
  background: rgba(19, 29, 51, 0.9);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 1.5rem;
  z-index: 1000;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  gap: 1.25rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}

.nav-brand {
  display: flex; align-items: center; gap: 0.75rem;
  text-decoration: none; flex-shrink: 0; min-width: 200px;
}
.brand-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; color: white; flex-shrink: 0;
  box-shadow: 0 4px 18px rgba(236, 72, 153, 0.4);
  animation: floatSlow 4s ease-in-out infinite;
}
.brand-titles { display: flex; flex-direction: column; }
.brand-name {
  font-size: 1.2rem; font-weight: 900; color: #fff;
  letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.35rem;
}
.brand-sub {
  font-size: 0.68rem; font-weight: 800; color: var(--cyan);
  letter-spacing: 0.08em; text-transform: uppercase;
}

.nav-search {
  flex: 1; max-width: 480px; position: relative;
}
.nav-search input {
  width: 100%;
  padding: 0.65rem 1rem 0.65rem 2.6rem;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: #fff; font-size: 0.88rem;
  transition: var(--transition);
}
.nav-search input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 16px rgba(6, 182, 212, 0.4);
  outline: none;
}
.nav-search .search-icon {
  position: absolute; left: 1rem; top: 50%;
  transform: translateY(-50%);
  color: var(--cyan); font-size: 0.95rem; pointer-events: none;
}

.nav-actions {
  display: flex; align-items: center; gap: 0.65rem; margin-left: auto;
}

.btn-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; position: relative;
  transition: var(--transition);
  text-decoration: none;
}
.btn-icon:hover {
  background: var(--bg-hover);
  color: #fff;
  border-color: var(--cyan);
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(6, 182, 212, 0.25);
}

.nav-badge {
  position: absolute; top: -4px; right: -4px;
  background: linear-gradient(135deg, #EC4899, #F43F5E);
  color: white; font-size: 0.65rem; font-weight: 800;
  padding: 2px 6px; border-radius: 999px;
  box-shadow: 0 2px 8px rgba(236, 72, 153, 0.5);
  border: 2px solid var(--bg-panel);
}

.nav-profile-btn {
  display: flex; align-items: center; gap: 0.65rem;
  padding: 0.35rem 0.85rem 0.35rem 0.45rem;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 999px;
  text-decoration: none;
  transition: var(--transition);
}
.nav-profile-btn:hover {
  background: var(--bg-hover);
  border-color: var(--indigo);
  box-shadow: 0 0 16px rgba(99, 102, 241, 0.35);
}
.nav-profile-avatar {
  width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--cyan);
}
.nav-profile-info {
  display: flex; flex-direction: column; text-align: left;
}
.nav-profile-name { font-size: 0.82rem; font-weight: 700; color: #fff; line-height: 1.2; }
.nav-profile-role { font-size: 0.65rem; font-weight: 800; color: var(--cyan); }

/* ── Badges y Etiquetas ──────────────────────────────────────────── */
.badge-docente {
  background: linear-gradient(135deg, #F59E0B, #D97706);
  color: #111827; font-size: 0.7rem; font-weight: 900;
  padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 0.3rem;
  box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
  letter-spacing: 0.02em;
}

.badge-alumno {
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(99, 102, 241, 0.25));
  border: 1px solid rgba(6, 182, 212, 0.4);
  color: #67E8F9; font-size: 0.7rem; font-weight: 800;
  padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 0.3rem;
}

.badge-category {
  font-size: 0.72rem; font-weight: 800; padding: 3px 10px;
  border-radius: 8px; display: inline-flex; align-items: center; gap: 0.35rem;
}
.cat-general { background: rgba(99, 102, 241, 0.2); color: #A5B4FC; border: 1px solid rgba(99, 102, 241, 0.35); }
.cat-duda { background: rgba(236, 72, 153, 0.2); color: #F472B6; border: 1px solid rgba(236, 72, 153, 0.35); }
.cat-material { background: rgba(6, 182, 212, 0.2); color: #67E8F9; border: 1px solid rgba(6, 182, 212, 0.35); }
.cat-aviso { background: rgba(245, 158, 11, 0.2); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.4); }
.cat-proyecto { background: rgba(16, 185, 129, 0.2); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.35); }

/* ── Botones Genéricos ───────────────────────────────────────────── */
.btn-primary {
  background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
  background-size: 200% 200%;
  animation: rainbowShift 6s ease infinite;
  color: #fff; font-weight: 700; font-size: 0.9rem;
  padding: 0.7rem 1.4rem; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
  transition: var(--transition);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(236, 72, 153, 0.5);
  color: #fff;
}

.btn-secondary {
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  color: var(--text-2); font-weight: 700; font-size: 0.88rem;
  padding: 0.65rem 1.2rem; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  transition: var(--transition);
}
.btn-secondary:hover {
  background: var(--bg-hover);
  color: #fff;
  border-color: var(--cyan);
  transform: translateY(-2px);
}

.btn-emerald {
  background: linear-gradient(135deg, #10B981, #059669);
  color: white; font-weight: 700; font-size: 0.88rem;
  padding: 0.65rem 1.2rem; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
  transition: var(--transition);
}
.btn-emerald:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
}

/* ── Tarjetas y Paneles ─────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-md);
  transition: var(--transition);
}
.card:hover {
  border-color: var(--border-strong);
}

/* ── Layout General de la Aplicación ────────────────────────────── */
.app-layout {
  display: grid;
  grid-template-columns: 260px 1fr 310px;
  gap: 1.5rem;
  max-width: 1380px;
  margin: calc(var(--navbar-h) + 1.25rem) auto 2rem;
  padding: 0 1.25rem;
}

@media (max-width: 1150px) {
  .app-layout { grid-template-columns: 240px 1fr; }
  .layout-right { display: none; }
}
@media (max-width: 860px) {
  .app-layout { grid-template-columns: 1fr; }
  .layout-left { display: none; }
}

/* ── Menú Lateral Izquierdo ─────────────────────────────────────── */
.sidebar-user-card {
  padding: 1.4rem;
  text-align: center;
  background: linear-gradient(180deg, rgba(31, 46, 78, 0.9) 0%, rgba(19, 29, 51, 0.9) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 1.2rem;
}
.sidebar-avatar {
  width: 76px; height: 76px; border-radius: 50%;
  object-fit: cover; margin: 0 auto 0.75rem;
  border: 3px solid var(--cyan);
  box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
}
.sidebar-name { font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 0.25rem; }
.sidebar-nav-links {
  display: flex; flex-direction: column; gap: 0.4rem;
}
.sidebar-link {
  display: flex; align-items: center; gap: 0.85rem;
  padding: 0.75rem 1rem; border-radius: var(--radius-md);
  color: var(--text-2); font-weight: 600; font-size: 0.9rem;
  transition: var(--transition);
  text-decoration: none;
}
.sidebar-link i { font-size: 1.1rem; width: 22px; text-align: center; }
.sidebar-link:hover, .sidebar-link.active {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(6, 182, 212, 0.2));
  color: #fff;
  border: 1px solid rgba(6, 182, 212, 0.35);
  box-shadow: 0 4px 15px rgba(6, 182, 212, 0.15);
}

/* ── Feed & Post Creator ────────────────────────────────────────── */
.post-creator {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-md);
}
.creator-top { display: flex; align-items: center; gap: 0.85rem; }
.creator-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--indigo); }
.creator-placeholder-btn {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.75rem 1.25rem;
  color: var(--text-3); font-size: 0.92rem; text-align: left;
  transition: var(--transition);
}
.creator-placeholder-btn:hover { background: var(--bg-hover); color: var(--text-2); border-color: var(--cyan); }

.post-creator-expanded { display: none; margin-top: 1rem; }
.post-creator-expanded.active { display: block; animation: popIn 0.3s ease; }

.creator-textarea {
  width: 100%; min-height: 105px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 0.9rem;
  color: #fff; font-size: 0.95rem; resize: vertical; outline: none;
}
.creator-textarea:focus { border-color: var(--cyan); box-shadow: 0 0 16px rgba(6, 182, 212, 0.35); }

.creator-category-bar {
  display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0;
}
.cat-choice {
  padding: 0.4rem 0.85rem; border-radius: 999px;
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-3); font-size: 0.78rem; font-weight: 700;
  cursor: pointer; transition: var(--transition);
}
.cat-choice:hover { background: var(--bg-hover); color: #fff; }
.cat-choice.selected {
  background: linear-gradient(135deg, var(--indigo), var(--pink));
  color: white; border-color: transparent;
  box-shadow: 0 2px 10px rgba(236, 72, 153, 0.4);
}

.creator-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 0.85rem; padding-top: 0.85rem;
  border-top: 1px solid var(--border);
}

/* ── Barra de Filtros del Feed ──────────────────────────────────── */
.feed-filter-bar {
  display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1.25rem;
}
.filter-pill {
  padding: 0.5rem 1rem; border-radius: 999px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-2); font-size: 0.82rem; font-weight: 700;
  white-space: nowrap; cursor: pointer; transition: var(--transition);
  display: inline-flex; align-items: center; gap: 0.45rem;
}
.filter-pill:hover { background: var(--bg-hover); color: #fff; }
.filter-pill.active {
  background: linear-gradient(135deg, #6366F1, #06B6D4);
  color: white; border-color: transparent;
  box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
}

/* ── Tarjeta de Publicación ─────────────────────────────────────── */
.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.35rem;
  margin-bottom: 1.35rem;
  box-shadow: var(--shadow-md);
  transition: var(--transition);
  animation: popIn 0.35s ease;
}
.post-card:hover { border-color: var(--border-strong); }

.post-header {
  display: flex; align-items: center; gap: 0.85rem; margin-bottom: 0.9rem;
}
.post-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  object-fit: cover; cursor: pointer;
  border: 2px solid var(--cyan);
  transition: var(--transition);
}
.post-avatar:hover { transform: scale(1.08); box-shadow: 0 0 14px rgba(6, 182, 212, 0.5); }
.post-meta { display: flex; flex-direction: column; flex: 1; }
.post-author-row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
.post-author { font-weight: 800; font-size: 0.96rem; color: #fff; cursor: pointer; }
.post-author:hover { color: var(--cyan-light); text-decoration: underline; }
.post-time { font-size: 0.75rem; color: var(--text-3); }

.post-content { font-size: 0.96rem; color: var(--text-2); line-height: 1.65; margin-bottom: 1rem; word-break: break-word; }
.post-content p { margin-bottom: 0.6rem; }
.post-content pre {
  background: #090E1A; padding: 0.9rem; border-radius: 10px;
  overflow-x: auto; color: #A5B4FC; font-family: monospace; font-size: 0.85rem;
  border: 1px solid rgba(255,255,255,0.08); margin: 0.5rem 0;
}

.post-image {
  width: 100%; max-height: 400px; object-fit: cover;
  border-radius: var(--radius-md); margin-bottom: 1rem;
  cursor: pointer; transition: var(--transition);
}
.post-image:hover { transform: scale(1.01); filter: brightness(1.05); }

.post-stats {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5rem 0; border-bottom: 1px solid var(--border);
  font-size: 0.82rem; color: var(--text-3); margin-bottom: 0.6rem;
}

.post-actions {
  display: flex; gap: 0.5rem; position: relative;
}
.btn-post-action {
  flex: 1; padding: 0.6rem; border-radius: 10px;
  background: transparent; border: 1px solid transparent;
  color: var(--text-2); font-size: 0.86rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 0.45rem;
  transition: var(--transition); position: relative;
}
.btn-post-action:hover {
  background: var(--bg-hover); color: #fff;
}
.btn-post-action.liked {
  color: #67E8F9;
  background: rgba(6, 182, 212, 0.15);
  border-color: rgba(6, 182, 212, 0.35);
}

/* ── Menú de Reacciones Flotante ────────────────────────────────── */
.reactions-popup {
  position: absolute; bottom: 100%; left: 0;
  background: rgba(19, 29, 51, 0.96);
  border: 1px solid var(--border-glow);
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  border-radius: 999px;
  padding: 4px 8px;
  display: none; align-items: center; gap: 6px;
  backdrop-filter: blur(16px);
  z-index: 100;
  animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.btn-post-action:hover .reactions-popup,
.reactions-popup:hover { display: flex; }

.reaction-emoji-btn {
  font-size: 1.35rem; background: transparent; border: none;
  padding: 3px 6px; border-radius: 50%; cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.reaction-emoji-btn:hover {
  transform: scale(1.4) translateY(-4px);
}

/* ── Comentarios ────────────────────────────────────────────────── */
.comments-section {
  display: none; margin-top: 1rem; padding-top: 1rem;
  border-top: 1px solid var(--border);
}
.comments-section.active { display: block; animation: popIn 0.3s ease; }

.comment-input-row { display: flex; gap: 0.65rem; margin-bottom: 0.85rem; }
.comment-input-row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
.comment-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.5rem 1rem; color: #fff; font-size: 0.85rem;
}
.comment-input:focus { outline: none; border-color: var(--cyan); }

.comment-item { display: flex; gap: 0.65rem; margin-bottom: 0.75rem; }
.comment-item img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; }
.comment-bubble {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 14px; padding: 0.65rem 0.85rem; flex: 1;
}
.comment-author { font-size: 0.82rem; font-weight: 800; color: #fff; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.4rem; }
.comment-author span { cursor: pointer; }
.comment-author span:hover { color: var(--cyan-light); text-decoration: underline; }
.comment-text { font-size: 0.85rem; color: var(--text-2); }
.comment-time { font-size: 0.68rem; color: var(--text-3); margin-top: 0.25rem; }

/* ── Widget Pomodoro de Estudio ─────────────────────────────────── */
.pomodoro-card {
  padding: 1.25rem;
  background: linear-gradient(180deg, rgba(26, 38, 66, 0.95) 0%, rgba(19, 29, 51, 0.95) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  margin-bottom: 1.2rem;
  text-align: center;
}
.pomodoro-timer {
  font-size: 2.3rem; font-weight: 900;
  font-family: monospace; letter-spacing: 0.05em;
  color: #fff; margin: 0.5rem 0;
  text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
}
.pomodoro-progress-bar {
  height: 6px; background: var(--bg-input);
  border-radius: 999px; overflow: hidden; margin-bottom: 0.9rem;
}
.pomodoro-progress-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #06B6D4, #6366F1, #EC4899);
  transition: width 1s linear;
}
.pomodoro-controls { display: flex; gap: 0.5rem; justify-content: center; }

/* ── Widget Metas del Día ───────────────────────────────────────── */
.checklist-card {
  padding: 1.25rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  margin-bottom: 1.2rem;
}
.checklist-item {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.45rem 0; font-size: 0.84rem; color: var(--text-2);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.checklist-item.done { text-decoration: line-through; color: var(--text-3); }
.checklist-item input[type="checkbox"] {
  accent-color: var(--emerald); width: 16px; height: 16px; cursor: pointer;
}

/* ── Directorio Modal / Grid de Compañeros ──────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(11, 17, 32, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
  z-index: 2000; padding: 1.5rem;
}
.modal-overlay.active { display: flex; animation: popIn 0.25s ease; }

.modal-content {
  background: var(--bg-modal);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  max-width: 760px; width: 100%; max-height: 85vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.modal-header {
  padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 1.15rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
.modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }

.peers-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem;
}
.peer-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1.15rem; text-align: center;
  transition: var(--transition);
}
.peer-card:hover {
  background: var(--bg-hover);
  border-color: var(--cyan);
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(6, 182, 212, 0.2);
}
.peer-card-avatar {
  width: 60px; height: 60px; border-radius: 50%;
  object-fit: cover; margin: 0 auto 0.6rem;
  border: 2px solid var(--indigo);
}
.peer-card-name { font-size: 0.92rem; font-weight: 800; color: #fff; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peer-card-bio { font-size: 0.75rem; color: var(--text-3); margin-bottom: 0.75rem; height: 32px; overflow: hidden; line-height: 1.35; }
.peer-card-actions { display: flex; gap: 0.4rem; justify-content: center; }

/* ── Menú Desplegable de Notificaciones ─────────────────────────── */
.dropdown-menu {
  position: absolute; top: calc(var(--navbar-h) + 6px); right: 1.5rem;
  width: 340px; background: var(--bg-panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  display: none; flex-direction: column;
  z-index: 1500; overflow: hidden;
  animation: popIn 0.2s ease;
}
.dropdown-menu.active { display: flex; }
.dropdown-header {
  padding: 0.85rem 1.15rem; border-bottom: 1px solid var(--border);
  font-size: 0.88rem; font-weight: 800; color: #fff;
  display: flex; justify-content: space-between; align-items: center;
}
.dropdown-list { max-height: 320px; overflow-y: auto; }
.dropdown-item {
  display: flex; gap: 0.75rem; padding: 0.75rem 1.15rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 0.82rem; color: var(--text-2); transition: var(--transition);
  cursor: pointer;
}
.dropdown-item:hover { background: var(--bg-hover); color: #fff; }
.dropdown-item.unread { background: rgba(99, 102, 241, 0.12); }

/* ── Toast de Notificaciones ────────────────────────────────────── */
.toast-container {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
  display: flex; flex-direction: column; gap: 0.6rem; pointer-events: none;
}
.toast {
  padding: 0.75rem 1.25rem; border-radius: 12px; font-size: 0.88rem; font-weight: 600;
  display: flex; align-items: center; gap: 0.6rem; box-shadow: var(--shadow-lg);
  pointer-events: auto; animation: popIn 0.3s ease; color: #fff;
}
.toast.success { background: #059669; border: 1px solid #34D399; }
.toast.error { background: #DC2626; border: 1px solid #F87171; }
.toast.info { background: #4F46E5; border: 1px solid #818CF8; }

/* ── Spinner ─────────────────────────────────────────────────────── */
.spinner {
  width: 24px; height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

  <script>
const SUPABASE_URL = 'https://sqslyuhrfjvspsupjylh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DasYg9xJ23y5AfZMXDAl_w_xkLuMTFw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function getCurrentUser() {
  const { data: { user } } = await sb.auth.getUser();
  return user;
}

async function getProfile(userId) {
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', userId)
    .single();
  if (error) return null;
  return data;
}

function isDocenteProfile(profile) {
  if (!profile) return false;
  const bio = (profile.bio || '').toLowerCase();
  const username = (profile.username || '').toLowerCase();
  const fullName = (profile.full_name || '').toLowerCase();
  return bio.includes('docente') || bio.includes('profesor') || bio.includes('admin') ||
         username.includes('docente') || username.includes('profesor') ||
         fullName.includes('prof.') || fullName.includes('ing.') || fullName.includes('lic.');
}

async function uploadMedia(file, folder = 'posts') {
  try {
    const ext = file.name.split('.').pop();
    const fileName = `${folder}/${Date.now()}-${Math.random().toString(36).substring(2)}.${ext}`;
    const { data, error } = await sb.storage
      .from('media')
      .upload(fileName, file, { cacheControl: '3600', upsert: false });

    if (error) return await fileToBase64(file);
    const { data: publicUrlData } = sb.storage.from('media').getPublicUrl(fileName);
    return publicUrlData.publicUrl;
  } catch (err) {
    return await fileToBase64(file);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

function timeAgo(dateString) {
  if (!dateString) return '';
  const date = new Date(dateString);
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);

  if (seconds < 60) return 'Hace un momento';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `Hace ${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `Hace ${hours} h`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `Hace ${days} d`;
  return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

function showToast(message, type = 'info') {
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(30px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

async function requireAuth() {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = 'index.html';
    return null;
  }
  return user;
}

async function redirectIfAuth() {
  const user = await getCurrentUser();
  if (user) {
    window.location.href = 'feed.html';
  }
}

  <script>
let currentUser = null;
let profileUser = null;
let isMyProfile = false;
let selectedNewAvatarFile = null;

document.addEventListener('DOMContentLoaded', async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;

  const urlParams = new URLSearchParams(window.location.search);
  const targetId = urlParams.get('id') || currentUser.id;
  isMyProfile = (targetId === currentUser.id);

  await loadProfile(targetId);
  await loadUserPosts(targetId);
});

async function loadProfile(userId) {
  profileUser = await getProfile(userId);
  if (!profileUser) {
    document.getElementById('profileFullName').textContent = 'Integrante no encontrado';
    return;
  }

  const avatarUrl = profileUser.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
  const fullName = profileUser.full_name || profileUser.username;
  const isDoc = isDocenteProfile(profileUser);

  document.getElementById('profileAvatar').src = avatarUrl;
  document.getElementById('profileFullName').textContent = fullName;
  document.getElementById('profileUsername').textContent = '@' + profileUser.username;
  document.getElementById('profileBio').textContent = profileUser.bio || (isDoc ? 'Docente / Instructor de CampusNet' : 'Estudiante del Curso');

  const roleBadge = document.getElementById('profileRoleBadge');
  if (isDoc) {
    roleBadge.className = 'badge-docente';
    roleBadge.innerHTML = '<i class="fa-solid fa-crown"></i> Docente / Administrador';
  } else {
    roleBadge.className = 'badge-alumno';
    roleBadge.innerHTML = '<i class="fa-solid fa-user-check"></i> Estudiante';
  }

  const actions = document.getElementById('profileActionsContainer');
  if (isMyProfile) {
    actions.innerHTML = `
      <button class="btn-secondary" onclick="openEditProfileModal()">
        <i class="fa-solid fa-pen-to-square" style="color:var(--cyan);"></i> Editar Ficha
      </button>
      <button class="btn-secondary" onclick="openChangePasswordModal()">
        <i class="fa-solid fa-key" style="color:var(--pink);"></i> Cambiar Clave
      </button>
    `;
  } else {
    actions.innerHTML = `
      <a href="messages.html?chat=${userId}" class="btn-primary" style="padding:0.65rem 1.25rem;">
        <i class="fa-solid fa-comments"></i> Enviar Consulta
      </a>
      <button class="btn-secondary" id="btnConnect" onclick="toggleConnect()">
        <i class="fa-solid fa-user-plus" style="color:var(--emerald);"></i> Conectar
      </button>
      <button class="btn-icon" onclick="copyProfileLink()" title="Compartir Perfil">
        <i class="fa-solid fa-share-nodes"></i>
      </button>
    `;
  }
}

async function loadUserPosts(userId) {
  const container = document.getElementById('userPostsContainer');
  const { data: posts, error } = await sb
    .from('posts')
    .select('id, content, image_url, created_at, likes(id)')
    .eq('user_id', userId)
    .order('created_at', { ascending: false });

  if (error || !posts || posts.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-3);"><p>Aún no ha compartido publicaciones en el tablón.</p></div>';
    document.getElementById('statsPostsCount').textContent = '0';
    document.getElementById('statsLikesCount').textContent = '0';
    return;
  }

  document.getElementById('statsPostsCount').textContent = posts.length;
  const totalLikes = posts.reduce((acc, p) => acc + (p.likes ? p.likes.length : 0), 0);
  document.getElementById('statsLikesCount').textContent = totalLikes;

  const level = Math.min(Math.floor(posts.length / 3) + 1, 10);
  document.getElementById('statsLevelBadge').textContent = 'Nivel ' + level;

  container.innerHTML = posts.map(p => `
    <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:1rem;">
      <div style="font-size:0.75rem;color:var(--text-3);margin-bottom:0.4rem;">
        <i class="fa-regular fa-clock"></i> ${timeAgo(p.created_at)}
      </div>
      <div style="font-size:0.95rem;color:#fff;line-height:1.6;">${escapeHtml(p.content)}</div>
      ${p.image_url ? `<img src="${p.image_url}" style="border-radius:10px;max-height:260px;width:100%;object-fit:cover;margin-top:0.75rem;">` : ''}
    </div>
  `).join('');
}

function toggleConnect() {
  const btn = document.getElementById('btnConnect');
  const isConnected = btn.classList.contains('connected');
  if (isConnected) {
    btn.classList.remove('connected');
    btn.innerHTML = '<i class="fa-solid fa-user-plus" style="color:var(--emerald);"></i> Conectar';
    showToast('Conexión retirada', 'info');
  } else {
    btn.classList.add('connected');
    btn.innerHTML = '<i class="fa-solid fa-user-check" style="color:var(--cyan);"></i> Conectado';
    showToast('¡Conectado exitosamente con este compañero! 🤝', 'success');
  }
}

function copyProfileLink() {
  navigator.clipboard.writeText(window.location.href);
  showToast('¡Enlace del perfil copiado al portapapeles!', 'info');
}

// ── MODALES DE EDICIÓN Y CONTRASEÑA ────────────────────────────────
function openEditProfileModal() {
  document.getElementById('editFullName').value = profileUser?.full_name || '';
  document.getElementById('editBio').value = profileUser?.bio || '';
  document.getElementById('editAvatarPreview').src = profileUser?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
  document.getElementById('editProfileModal').classList.add('active');
}
function closeEditProfileModal() {
  document.getElementById('editProfileModal').classList.remove('active');
  selectedNewAvatarFile = null;
}

function previewEditAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  selectedNewAvatarFile = file;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('editAvatarPreview').src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfileChanges(e) {
  e.preventDefault();
  const btn = document.getElementById('btnSaveProfileSubmit');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    let avatarUrl = profileUser?.avatar_url;
    if (selectedNewAvatarFile) {
      avatarUrl = await uploadMedia(selectedNewAvatarFile, 'avatars');
    }

    const newFullName = document.getElementById('editFullName').value.trim();
    const newBio = document.getElementById('editBio').value.trim();

    const { error } = await sb.from('profiles').update({
      full_name: newFullName,
      bio: newBio,
      avatar_url: avatarUrl
    }).eq('id', currentUser.id);

    if (error) {
      showToast('Error al actualizar: ' + error.message, 'error');
    } else {
      showToast('¡Ficha actualizada exitosamente!', 'success');
      closeEditProfileModal();
      await loadProfile(currentUser.id);
    }
  } catch (err) {
    showToast('Error de conexión.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar Cambios';
  }
}

function openChangePasswordModal() {
  document.getElementById('newPasswordInput').value = '';
  document.getElementById('confirmPasswordInput').value = '';
  document.getElementById('changePasswordModal').classList.add('active');
}
function closeChangePasswordModal() {
  document.getElementById('changePasswordModal').classList.remove('active');
}

async function handleChangePassword(e) {
  e.preventDefault();
  const pass1 = document.getElementById('newPasswordInput').value;
  const pass2 = document.getElementById('confirmPasswordInput').value;

  if (pass1 !== pass2) {
    showToast('Las contraseñas no coinciden.', 'error');
    return;
  }
  if (pass1.length < 6) {
    showToast('Mínimo 6 caracteres requeridos.', 'error');
    return;
  }

  const btn = document.getElementById('btnSavePasswordSubmit');
  btn.disabled = true;
  btn.textContent = 'Actualizando...';

  try {
    const { error } = await sb.auth.updateUser({ password: pass1 });
    if (error) {
      showToast('Error: ' + error.message, 'error');
    } else {
      showToast('¡Contraseña actualizada correctamente!', 'success');
      closeChangePasswordModal();
    }
  } catch (err) {
    showToast('Error al cambiar clave.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Actualizar Contraseña';
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
  </script>
