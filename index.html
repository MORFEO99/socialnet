<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusNet — Acceso al Curso</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
/* ================================================================
   CAMPUSNET — PLATAFORMA ACADÉMICA CON PALETA VIBRANTE Y LUMINOSA
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --bg-page:        #0E1424;
  --bg-panel:       #151F36;
  --bg-card:        rgba(26, 38, 66, 0.85);
  --bg-card-hover:  rgba(35, 50, 86, 0.95);
  --bg-input:       #1E2C4D;
  --bg-hover:       #2A3C66;
  --bg-modal:       #162038;

  --indigo:         #6366F1;
  --purple:         #8B5CF6;
  --pink:           #EC4899;
  --cyan:           #06B6D4;
  --emerald:        #10B981;
  --amber:          #F59E0B;
  --rose:           #F43F5E;

  --text-1:         #FFFFFF;
  --text-2:         #CBD5E1;
  --text-3:         #94A3B8;

  --border:         rgba(255, 255, 255, 0.14);
  --border-strong:  rgba(255, 255, 255, 0.25);
  --border-glow:    rgba(99, 102, 241, 0.55);

  --shadow-sm:      0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-md:      0 8px 26px rgba(0, 0, 0, 0.45);
  --shadow-lg:      0 18px 50px rgba(0, 0, 0, 0.6);
  --shadow-glow:    0 0 25px rgba(99, 102, 241, 0.4);

  --radius-sm:      10px;
  --radius-md:      14px;
  --radius-lg:      20px;
  --radius-xl:      26px;

  --navbar-h:       68px;
  --transition:     all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-page);
  background-image: 
    radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.32) 0%, transparent 45%),
    radial-gradient(circle at 90% 15%, rgba(6, 182, 212, 0.28) 0%, transparent 42%),
    radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
    radial-gradient(circle at 80% 85%, rgba(236, 72, 153, 0.25) 0%, transparent 45%),
    radial-gradient(circle at 15% 90%, rgba(16, 185, 129, 0.25) 0%, transparent 45%);
  background-attachment: fixed;
  background-size: cover;
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
  overflow-x: hidden;
}

a { color: var(--cyan); text-decoration: none; transition: var(--transition); }
a:hover { text-decoration: none; color: #67E8F9; }
button { cursor: pointer; border: none; outline: none; font-family: inherit; }
input, textarea, select { font-family: inherit; }
img { max-width: 100%; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-panel); }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--indigo); }

/* ── Animaciones ─────────────────────────────────────────────────── */
@keyframes floatSlow {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
  50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.6); }
}

@keyframes pulseGreen {
  0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
  70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.96) translateY(14px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── Navbar ──────────────────────────────────────────────────────── */
.navbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--navbar-h);
  background: rgba(21, 31, 54, 0.88);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 1.75rem;
  z-index: 1000;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  gap: 1.25rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.nav-brand {
  display: flex; align-items: center; gap: 0.85rem;
  text-decoration: none; flex-shrink: 0; min-width: 210px;
}
.brand-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; color: white; flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
  animation: floatSlow 3.8s ease-in-out infinite;
}
.brand-titles { display: flex; flex-direction: column; }
.brand-name {
  font-size: 1.25rem; font-weight: 900; color: #fff;
  letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.4rem;
}
.brand-sub {
  font-size: 0.7rem; font-weight: 800; color: var(--cyan);
  text-transform: uppercase; letter-spacing: 0.1em;
}

.nav-tabs {
  display: flex; align-items: center; gap: 0.6rem;
  flex: 1; justify-content: center;
}
.nav-tab {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.6rem 1.25rem; height: 46px;
  border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 0.92rem; font-weight: 700;
  transition: var(--transition); text-decoration: none; position: relative;
}
.nav-tab i { font-size: 1.15rem; }
.nav-tab:hover { background: var(--bg-hover); color: #fff; transform: translateY(-1px); }
.nav-tab.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.25) 0%, rgba(236, 72, 153, 0.25) 100%);
  border: 1px solid rgba(236, 72, 153, 0.45);
  box-shadow: 0 4px 18px rgba(99, 102, 241, 0.25);
}
.nav-tab.active::after {
  content: ''; position: absolute; bottom: -12px; left: 15%; right: 15%;
  height: 3px; background: linear-gradient(90deg, #6366F1, #EC4899);
  border-radius: 3px;
}
@media(max-width: 768px){
  .nav-tab span { display: none; }
  .nav-tab { padding: 0.5rem 0.85rem; }
  .brand-titles { display: none; }
}

.nav-badge {
  background: linear-gradient(135deg, #EC4899, #F43F5E); color: white;
  font-size: 0.68rem; font-weight: 900;
  min-width: 20px; height: 20px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; box-shadow: 0 2px 8px rgba(236, 72, 153, 0.5);
}

.nav-right {
  display: flex; align-items: center; gap: 0.85rem;
  min-width: 210px; justify-content: flex-end;
}
.nav-profile-link {
  display: flex; align-items: center; gap: 0.7rem;
  padding: 0.4rem 0.85rem; border-radius: 999px;
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  transition: var(--transition);
}
.nav-profile-link:hover {
  background: var(--bg-hover); border-color: var(--cyan);
  transform: translateY(-1px); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
}
.nav-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--cyan);
}
.nav-user-info { display: flex; flex-direction: column; text-align: left; }
.nav-user-name { font-size: 0.86rem; font-weight: 800; color: var(--text-1); line-height: 1.2; }
.nav-user-role { font-size: 0.7rem; color: var(--emerald); font-weight: 700; }
@media(max-width: 900px){
  .nav-user-info { display: none; }
}

.btn-icon {
  width: 42px; height: 42px; background: var(--bg-hover);
  border-radius: var(--radius-sm); display: flex; align-items: center;
  justify-content: center; color: var(--text-2);
  font-size: 1.05rem; transition: var(--transition); flex-shrink: 0;
  border: 1px solid var(--border);
}
.btn-icon:hover {
  background: var(--bg-card); color: #fff;
  border-color: var(--cyan); transform: translateY(-1px);
  box-shadow: 0 2px 10px rgba(6, 182, 212, 0.25);
}

/* ── Botones ─────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.6rem; padding: 0.65rem 1.35rem;
  border-radius: var(--radius-sm);
  font-size: 0.9rem; font-weight: 700;
  transition: var(--transition); border: none; cursor: pointer;
  white-space: nowrap; position: relative; overflow: hidden;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
  color: white; box-shadow: 0 4px 18px rgba(236, 72, 153, 0.45);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #7175f7 0%, #9a6df7 50%, #f45ca7 100%);
  box-shadow: 0 6px 26px rgba(236, 72, 153, 0.6);
  transform: translateY(-2px);
}
.btn-secondary {
  background: var(--bg-hover); color: var(--text-1);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background: var(--bg-card-hover); border-color: var(--cyan); color: #fff;
  transform: translateY(-1px); box-shadow: 0 4px 14px rgba(6, 182, 212, 0.25);
}
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--bg-hover); color: #fff; }
.btn-danger { background: linear-gradient(135deg, #F43F5E, #E11D48); color: white; box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4); }
.btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(244, 63, 94, 0.55); }
.btn-block { width: 100%; }
.btn-sm { padding: 0.45rem 1rem; font-size: 0.84rem; border-radius: 9px; }
.btn-lg { padding: 0.9rem 1.75rem; font-size: 1.02rem; border-radius: 14px; }

/* ── Layout ──────────────────────────────────────────────────────── */
.page-wrapper { padding-top: var(--navbar-h); min-height: 100vh; }
.container-feed { max-width: 1080px; margin: 0 auto; padding: 2.2rem 1.25rem; display: flex; gap: 1.85rem; align-items: flex-start; }
.feed-main { flex: 1; min-width: 0; }
.feed-sidebar { width: 330px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1.45rem; }
@media(max-width: 960px){
  .container-feed { flex-direction: column; }
  .feed-sidebar { width: 100%; }
}
.container-wide { max-width: 1080px; margin: 0 auto; padding: 2.2rem 1.25rem; }

/* ── Tarjetas ────────────────────────────────────────────────────── */
.card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden;
  box-shadow: var(--shadow-md); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: var(--transition);
}
.card:hover {
  border-color: rgba(255,255,255,0.22);
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(0,0,0,0.55);
}

/* ── Hero Banner del Curso con Gradiente Luminoso ─────────────────── */
.course-banner {
  background: 
    linear-gradient(135deg, rgba(30, 44, 76, 0.95) 0%, rgba(20, 29, 52, 0.98) 100%),
    radial-gradient(circle at top right, rgba(236, 72, 153, 0.35) 0%, rgba(99, 102, 241, 0.3) 50%, transparent 80%);
  border: 1px solid rgba(236, 72, 153, 0.45);
  border-radius: var(--radius-xl);
  padding: 1.8rem 2rem; margin-bottom: 1.6rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1.35rem;
  position: relative; overflow: hidden;
  box-shadow: 0 12px 35px rgba(0,0,0,0.45), 0 0 35px rgba(99, 102, 241, 0.25);
  animation: popIn 0.4s ease-out;
}
.course-banner::before {
  content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
  background: linear-gradient(to bottom, #EC4899, #8B5CF6, #06B6D4, #10B981);
}
.course-banner-info h2 {
  font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 0.4rem;
  letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap;
}
.course-banner-info p {
  font-size: 0.9rem; color: var(--text-2); font-weight: 500;
  display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
}
.course-tag {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.3rem 0.85rem; border-radius: 999px;
  font-size: 0.78rem; font-weight: 800;
  background: rgba(16, 185, 129, 0.22); color: #6EE7B7;
  border: 1px solid rgba(16, 185, 129, 0.45);
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
}

/* ── Filtros ─────────────────────────────────────────────────────── */
.filter-tabs-wrap {
  display: flex; gap: 0.65rem; overflow-x: auto;
  padding-bottom: 0.85rem; margin-bottom: 1.45rem;
  scrollbar-width: none;
}
.filter-tabs-wrap::-webkit-scrollbar { display: none; }
.filter-pill {
  display: inline-flex; align-items: center; gap: 0.55rem;
  padding: 0.55rem 1.15rem; border-radius: 999px;
  background: rgba(22, 32, 56, 0.9); border: 1px solid var(--border);
  color: var(--text-2); font-size: 0.88rem; font-weight: 700;
  cursor: pointer; transition: var(--transition); white-space: nowrap;
}
.filter-pill:hover { background: var(--bg-hover); color: #fff; transform: translateY(-1px); border-color: var(--cyan); }
.filter-pill.active {
  background: linear-gradient(135deg, #6366F1, #8B5CF6); color: white; border-color: #8B5CF6;
  box-shadow: 0 4px 18px rgba(99, 102, 241, 0.45); transform: translateY(-1px);
}

/* ── Badges de Categorías VIBRANTES ──────────────────────────────── */
.badge-category {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.3rem 0.8rem; border-radius: 10px;
  font-size: 0.74rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em;
}
.cat-aviso    { background: rgba(245,158,11,0.25); color: #FDE68A; border: 1px solid #F59E0B; box-shadow: 0 0 10px rgba(245,158,11,0.25); }
.cat-duda     { background: rgba(236,72,153,0.25); color: #FCE7F3; border: 1px solid #EC4899; box-shadow: 0 0 10px rgba(236,72,153,0.25); }
.cat-material { background: rgba(6,182,212,0.25);  color: #CFFAFE; border: 1px solid #06B6D4; box-shadow: 0 0 10px rgba(6,182,212,0.25); }
.cat-proyecto { background: rgba(16,185,129,0.25); color: #D1FAE5; border: 1px solid #10B981; box-shadow: 0 0 10px rgba(16,185,129,0.25); }
.cat-general  { background: rgba(99,102,241,0.25); color: #E0E7FF; border: 1px solid #6366F1; box-shadow: 0 0 10px rgba(99,102,241,0.25); }

.badge-docente {
  font-size: 0.72rem; font-weight: 800; color: #FEF08A;
  background: linear-gradient(135deg, rgba(245,158,11,0.3), rgba(236,72,153,0.25));
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid #F59E0B; display: inline-flex; align-items: center; gap: 0.4rem;
  box-shadow: 0 0 14px rgba(245,158,11,0.35);
}
.badge-alumno {
  font-size: 0.72rem; font-weight: 700; color: #A7F3D0;
  background: rgba(16,185,129,0.2); padding: 2px 9px; border-radius: 999px;
  border: 1px solid #10B981; display: inline-flex; align-items: center; gap: 0.35rem;
}

/* ── Tarjetas de Inicio Rápido COLORIDAS ─────────────────────────── */
.starter-cards-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.15rem; margin-top: 1.45rem;
}
@media(max-width: 700px){ .starter-cards-grid { grid-template-columns: 1fr; } }

.starter-card {
  background: rgba(30, 44, 76, 0.75); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 1.45rem 1.15rem; text-align: center;
  cursor: pointer; transition: var(--transition); display: flex; flex-direction: column;
  align-items: center; gap: 0.75rem;
}
.starter-card:hover {
  background: var(--bg-card-hover); border-color: var(--cyan);
  transform: translateY(-5px); box-shadow: 0 12px 28px rgba(6, 182, 212, 0.25);
}
.starter-icon {
  width: 52px; height: 52px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.55rem; margin-bottom: 0.3rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.starter-card h4 { font-size: 1rem; font-weight: 800; color: #fff; }
.starter-card p { font-size: 0.82rem; color: var(--text-2); line-height: 1.45; }

/* ── Creador de Publicaciones ────────────────────────────────────── */
.post-creator {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); padding: 1.45rem; margin-bottom: 1.6rem;
  box-shadow: var(--shadow-md); backdrop-filter: blur(20px);
}
.post-creator-top { display: flex; align-items: center; gap: 0.95rem; }
.post-creator-top img {
  width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  border: 2px solid var(--cyan); box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
}
.post-creator-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.8rem 1.45rem;
  color: var(--text-2); font-size: 0.95rem; font-weight: 500; cursor: pointer;
  transition: var(--transition); display: flex; align-items: center; gap: 0.65rem;
}
.post-creator-input:hover {
  border-color: var(--cyan); color: #fff;
  background: var(--bg-hover); transform: translateY(-1px);
  box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
}

.post-creator-expanded { display: none; flex-direction: column; gap: 1.1rem; margin-top: 0.95rem; animation: popIn 0.25s ease-out; }
.post-creator-expanded.active { display: flex; }
.post-creator-expanded textarea {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 1rem 1.2rem;
  color: var(--text-1); font-size: 0.98rem; resize: none; outline: none;
  min-height: 105px; line-height: 1.6; transition: var(--transition);
}
.post-creator-expanded textarea:focus {
  border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.35);
  background: rgba(30, 44, 76, 0.95);
}

.category-selector-title { font-size: 0.82rem; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; }
.category-options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.cat-choice {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.45rem 0.95rem; border-radius: 999px;
  background: var(--bg-input); border: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 700; color: var(--text-2);
  cursor: pointer; transition: var(--transition); user-select: none;
}
.cat-choice:hover { border-color: var(--cyan); color: #fff; transform: translateY(-1px); }
.cat-choice.selected {
  background: linear-gradient(135deg, #6366F1, #8B5CF6); color: white; border-color: #8B5CF6;
  box-shadow: 0 2px 12px rgba(99, 102, 241, 0.45); transform: translateY(-1px);
}

.post-image-preview {
  position: relative; border-radius: var(--radius-md); overflow: hidden; max-height: 260px;
}
.post-image-preview img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
.post-image-preview .remove-img {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,0.85); color: white;
  border-radius: 50%; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; cursor: pointer; transition: var(--transition);
}
.post-image-preview .remove-img:hover { background: var(--rose); transform: scale(1.1); }

.post-creator-actions {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); padding-top: 1rem; flex-wrap: wrap; gap: 0.65rem;
}
.post-media-actions { display: flex; gap: 0.5rem; }
.btn-media {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 0.95rem; border-radius: var(--radius-sm);
  font-size: 0.86rem; font-weight: 700;
  color: var(--text-2); background: var(--bg-input); transition: var(--transition);
  border: 1px solid var(--border);
}
.btn-media:hover {
  background: var(--bg-hover); color: #fff;
  border-color: var(--cyan); transform: translateY(-1px);
}

/* ── Tarjetas de Publicación ─────────────────────────────────────── */
.post-card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); margin-bottom: 1.5rem;
  overflow: hidden; animation: popIn 0.35s ease;
  box-shadow: var(--shadow-md); backdrop-filter: blur(20px);
  transition: var(--transition);
}
.post-card:hover {
  border-color: rgba(255,255,255,0.2);
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
}

.post-header {
  display: flex; align-items: center; gap: 0.95rem;
  padding: 1.2rem 1.45rem 0.65rem;
}
.post-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0; cursor: pointer;

/* ── Comentarios ─────────────────────────────────────────────────── */

/* ── Widget Lateral ──────────────────────────────────────────────── */

}

/* ── Historias ───────────────────────────────────────────────────── */

/* ── Auth Page ───────────────────────────────────────────────────── */
.auth-page {

}

.form-group { margin-bottom: 1.2rem; }

.form-input-wrap { position: relative; }

  width: 100%; background: var(--bg-input);

}

.role-picker { display: flex; gap: 0.65rem; margin-bottom: 1.2rem; }

/* ── Mensajes y Chat ─────────────────────────────────────────────── */
.messages-layout {
  display: flex; height: calc(100vh - var(--navbar-h)); overflow: hidden;
}
.contacts-panel {
  width: 330px; flex-shrink: 0; background: rgba(21, 31, 54, 0.9);

}

}

}

.contact-avatar-wrap { position: relative; flex-shrink: 0; }
.contact-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
.online-dot {
  position: absolute; bottom: 1px; right: 1px;
  width: 13px; height: 13px; background: var(--emerald);

  animation: pulseGreen 2s infinite;
}
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-weight: 800; font-size: 0.92rem; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 0.4rem; }

.chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: transparent; }
.chat-header {
  display: flex; align-items: center; gap: 0.95rem;

}

.msg-bubble {

.msg-row.mine .msg-bubble {

}

.chat-input-bar {
  padding: 1.05rem 1.45rem; background: rgba(21, 31, 54, 0.9);

}
.chat-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.75rem 1.4rem; color: var(--text-1);
  font-size: 0.95rem; outline: none; transition: var(--transition);
}
.chat-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.35); }

.chat-no-contact {

}

/* ── Perfil con Portada Vibrante ─────────────────────────────────── */
.profile-cover {

.stat-item { text-align: left; }
.stat-value { font-size: 1.35rem; font-weight: 900; color: #fff; }

/* ── Modal y Lightbox ────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  opacity: 0; pointer-events: none; transition: opacity 0.22s ease; backdrop-filter: blur(10px);
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--bg-modal); border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl); width: 100%; max-width: 510px;
  max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-lg);
  transform: translateY(20px) scale(0.97); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.3rem 1.6rem; border-bottom: 1px solid var(--border);

}
.modal-body { padding: 1.6rem; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 0.9rem;
  padding: 1.2rem 1.6rem; border-top: 1px solid var(--border);
}

.lightbox-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.lightbox-overlay.active { opacity: 1; pointer-events: auto; }
.lightbox-overlay img {
  max-width: 90vw; max-height: 90vh; object-fit: contain;
  border-radius: var(--radius-md); cursor: default; animation: popIn 0.3s ease;
}

/* ── Loading States & Toast ──────────────────────────────────────── */
.spinner {
  width: 34px; height: 34px;
  border: 3px solid var(--border); border-top-color: var(--cyan);
  border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-state { text-align: center; padding: 2.75rem; color: var(--text-2); font-size: 0.95rem; font-weight: 600; }
.empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--text-2); }

.toast-container {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
  display: flex; flex-direction: column; gap: 0.6rem; pointer-events: none;
}
.toast {
  background: rgba(26, 38, 66, 0.95); border: 1px solid var(--border-strong);
  border-radius: var(--radius-md); padding: 0.9rem 1.25rem;
  font-size: 0.92rem; font-weight: 600; color: #fff; box-shadow: var(--shadow-lg);
  max-width: 350px; pointer-events: auto; animation: slideInRight 0.3s ease;
  backdrop-filter: blur(20px);
}
.toast.success { border-left: 4px solid var(--emerald); box-shadow: 0 4px 18px rgba(16, 185, 129, 0.3); }
.toast.error   { border-left: 4px solid var(--rose); box-shadow: 0 4px 18px rgba(244, 63, 94, 0.3); }
.toast.info    { border-left: 4px solid var(--cyan); box-shadow: 0 4px 18px rgba(6, 182, 212, 0.3); }
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to   { opacity: 1; transform: translateX(0); }
}

<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="logo-circle">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1>CampusNet</h1>
      <p>Comunidad y Plataforma de Aprendizaje del Curso</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
        </button>
        <button id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">
          <i class="fa-solid fa-user-plus"></i> Registrarse
        </button>
      </div>

      <div id="authError" class="error-msg"></div>

      <!-- Iniciar Sesión -->
      <form id="formLogin" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Correo Electrónico</label>
          <div class="form-input-wrap">
            <i class="fa-solid fa-envelope form-input-icon"></i>
            <input type="email" id="loginEmail" class="form-control" placeholder="usuario@correo.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.45rem;">
            <label class="form-label" for="loginPassword" style="margin-bottom:0;">Contraseña</label>
            <a href="javascript:void(0)" onclick="openForgotPasswordModal()" style="font-size:0.8rem; font-weight:700; color:var(--cyan);">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="form-input-wrap">
            <i class="fa-solid fa-lock form-input-icon"></i>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.35rem;">
          <span>Acceder al Aula Virtual</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Registro -->
      <form id="formRegister" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Tipo de Cuenta</label>
          <div class="role-picker">
            <div id="roleEstudiante" class="role-option selected" onclick="selectRole('estudiante')">
              <i class="fa-solid fa-user-graduate" style="color:var(--cyan);"></i> Estudiante
            </div>
            <div id="roleDocente" class="role-option" onclick="selectRole('docente')">
              <i class="fa-solid fa-chalkboard-user" style="color:var(--amber);"></i> Docente / Admin
            </div>
          </div>
        </div>

        <div id="docenteKeyGroup" class="form-group" style="display:none;">
          <label class="form-label" for="docenteKey">
            <span style="color:#FBBF24;"><i class="fa-solid fa-key"></i> Clave de Acceso Docente</span>
          </label>
          <div class="form-input-wrap">
            <i class="fa-solid fa-shield-halved form-input-icon" style="color:#FBBF24;"></i>
            <input type="password" id="docenteKey" class="form-control" placeholder="Ingresa la clave docente (ej: DOCENTE2026)">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regFullName" id="lblFullName">Nombre y Apellido</label>
          <div class="form-input-wrap">
            <i class="fa-solid fa-id-card form-input-icon"></i>
            <input type="text" id="regFullName" class="form-control" placeholder="Ej: Alex Torres" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regUsername">Usuario o Matrícula (@)</label>
          <div class="form-input-wrap">
            <i class="fa-solid fa-at form-input-icon"></i>
            <input type="text" id="regUsername" class="form-control" placeholder="alextorres" required pattern="^[a-zA-Z0-9_]{3,20}$" title="Solo letras, números y guión bajo (3 a 20 caracteres)">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Correo Electrónico</label>
          <div class="form-input-wrap">
            <i class="fa-solid fa-envelope form-input-icon"></i>
            <input type="email" id="regEmail" class="form-control" placeholder="tu@correo.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Contraseña (mínimo 6 caracteres)</label>
          <div class="form-input-wrap">
            <i class="fa-solid fa-lock form-input-icon"></i>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="btnRegister" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.35rem;">
          <span id="btnRegisterText">Registrarse en el Curso</span>
          <i class="fa-solid fa-sparkles"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Modal: Recuperar Contraseña -->
  <div id="forgotPasswordModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span><i class="fa-solid fa-key" style="color:var(--cyan);"></i> Recuperar Contraseña</span>
        <button class="btn-icon" style="width:32px;height:32px;" onclick="closeForgotPasswordModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form onsubmit="handleForgotPassword(event)">
        <div class="modal-body">
          <p style="font-size:0.9rem; color:var(--text-2); margin-bottom:1.1rem; line-height:1.55;">
            Ingresa tu correo registrado y te enviaremos las instrucciones de restablecimiento de contraseña.
          </p>
          <div class="form-group">
            <label class="form-label" for="resetEmail">Correo Electrónico</label>
            <div class="form-input-wrap">
              <i class="fa-solid fa-envelope form-input-icon"></i>
              <input type="email" id="resetEmail" class="form-control" placeholder="tu@correo.com" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeForgotPasswordModal()">Cancelar</button>
          <button type="submit" id="btnSendReset" class="btn btn-primary">Enviar Enlace</button>
        </div>
      </form>
    </div>
  </div>

  <script>
// =====================================================================
// CAMPUSNET — CLIENTE DE SUPABASE Y UTILIDADES GLOBALES
// =====================================================================

const SUPABASE_URL = 'https://sqslyuhrfjvspsupjylh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DasYg9xJ23y5AfZMXDAl_w_xkLuMTFw';

if (typeof supabase === 'undefined') {
  console.error('La librería @supabase/supabase-js no está cargada.');
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

window.sb = sb;

async function getCurrentUser() {
  const { data: { session }, error } = await sb.auth.getSession();
  if (error || !session) return null;
  return session.user;
}

async function getProfile(userId) {
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', userId)
    .single();

  if (error) {
    console.warn('No se encontró perfil:', error.message);
    return null;
  }
  return data;
}

function isDocenteProfile(profile) {
  if (!profile) return false;
  const bio = (profile.bio || '').toLowerCase();
  const username = (profile.username || '').toLowerCase();
  return bio.includes('[docente]') || bio.includes('[profesor]') || username.startsWith('profesor') || username.startsWith('docente');
}

async function uploadMedia(file, folder = 'posts') {
  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${folder}/${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;

    const { data, error } = await sb.storage
      .from('media')
      .upload(fileName, file, { cacheControl: '3600', upsert: false });

    if (error) {
      return await fileToBase64(file);
    }
    const { data: publicUrlData } = sb.storage.from('media').getPublicUrl(fileName);
    return publicUrlData.publicUrl;
  } catch (err) {
    return await fileToBase64(file);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

function timeAgo(dateString) {
  if (!dateString) return '';
  const date = new Date(dateString);
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);

  if (seconds < 60) return 'Hace un momento';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `Hace ${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `Hace ${hours} h`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `Hace ${days} d`;
  return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

function showToast(message, type = 'info') {
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(30px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

async function requireAuth() {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = 'index.html';
    return null;
  }
  return user;
}

async function redirectIfAuth() {
  const user = await getCurrentUser();
  if (user) {
    window.location.href = 'feed.html';
  }
}

  </script>
  <script>
let selectedRole = 'estudiante';
const DOCENTE_ACCESS_CODE = 'DOCENTE2026';

document.addEventListener('DOMContentLoaded', async () => {
  await redirectIfAuth();
});

function switchAuthTab(tab) {
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const formLogin = document.getElementById('formLogin');
  const formRegister = document.getElementById('formRegister');
  const authError = document.getElementById('authError');

  authError.style.display = 'none';

  if (tab === 'login') {
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
    formLogin.classList.add('active');
    formRegister.classList.remove('active');
  } else {
    tabLogin.classList.remove('active');
    tabRegister.classList.add('active');
    formLogin.classList.remove('active');
    formRegister.classList.add('active');
  }
}

function selectRole(role) {
  selectedRole = role;
  document.getElementById('roleEstudiante').classList.toggle('selected', role === 'estudiante');
  document.getElementById('roleDocente').classList.toggle('selected', role === 'docente');

  const keyGroup = document.getElementById('docenteKeyGroup');
  const btnText = document.getElementById('btnRegisterText');
  const keyInput = document.getElementById('docenteKey');

  if (role === 'docente') {
    keyGroup.style.display = 'block';
    keyInput.required = true;
    btnText.textContent = 'Registrarse como Docente';
  } else {
    keyGroup.style.display = 'none';
    keyInput.required = false;
    btnText.textContent = 'Registrarse como Estudiante';
  }
}

function displayError(msg) {
  const errBox = document.getElementById('authError');
  errBox.textContent = msg;
  errBox.style.display = 'block';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> Accediendo...';
  document.getElementById('authError').style.display = 'none';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      if (error.message.includes('Invalid login credentials')) {
        displayError('Correo o contraseña incorrectos.');
      } else if (error.message.includes('Email not confirmed')) {
        displayError('Debes confirmar tu correo o ejecutar el script de auto-confirmación en Supabase.');
      } else {
        displayError(error.message);
      }
      btn.disabled = false;
      btn.innerHTML = originalText;
      return;
    }

    const user = data.user;
    const { data: profile } = await sb.from('profiles').select('id').eq('id', user.id).maybeSingle();
    if (!profile) {
      const fallbackUsername = user.email.split('@')[0] + Math.floor(Math.random() * 1000);
      await sb.from('profiles').insert({
        id: user.id,
        username: fallbackUsername,
        full_name: user.user_metadata?.full_name || user.email.split('@')[0],
        avatar_url: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80',
        bio: 'Estudiante del Curso'
      });
    }

    showToast('¡Bienvenido al Aula Virtual!', 'success');
    setTimeout(() => { window.location.href = 'feed.html'; }, 400);
  } catch (err) {
    console.error(err);
    displayError('Error inesperado al acceder al aula.');
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('btnRegister');
  const fullName = document.getElementById('regFullName').value.trim();
  const username = document.getElementById('regUsername').value.trim().toLowerCase();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;

  if (selectedRole === 'docente') {
    const key = document.getElementById('docenteKey').value.trim();
    if (key !== DOCENTE_ACCESS_CODE) {
      displayError('Clave de acceso docente incorrecta. Si eres alumno, elige la opción Estudiante.');
      return;
    }
  }

  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> Registrando...';
  document.getElementById('authError').style.display = 'none';

  try {
    const { data: existingUser } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
    if (existingUser) {
      displayError('Ese usuario o matrícula (@' + username + ') ya está registrado.');
      btn.disabled = false;
      btn.innerHTML = originalText;
      return;
    }

    const defaultAvatar = selectedRole === 'docente'
      ? 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150&auto=format&fit=crop&q=80'
      : `https://api.dicebear.com/7.x/bottts/svg?seed=${username}`;

    const bioRole = selectedRole === 'docente' ? '[Docente] Profesor y Administrador del Curso' : 'Estudiante del Curso 2026';

    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: {
          username: username,
          full_name: fullName,
          avatar_url: defaultAvatar,
          role: selectedRole
        }
      }
    });

    if (error) {
      displayError(error.message);
      btn.disabled = false;
      btn.innerHTML = originalText;
      return;
    }

    const user = data.user;
    if (user) {
      await sb.from('profiles').upsert({
        id: user.id,
        username: username,
        full_name: fullName,
        avatar_url: defaultAvatar,
        bio: bioRole
      });

      if (data.session) {
        showToast('¡Registro exitoso! Ingresando al aula...', 'success');
        setTimeout(() => { window.location.href = 'feed.html'; }, 500);
      } else {
        showToast('Registro exitoso. Inicia sesión con tus credenciales.', 'info');
        switchAuthTab('login');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  } catch (err) {
    console.error(err);
    displayError('Error al crear la cuenta.');
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

function openForgotPasswordModal() {
  document.getElementById('forgotPasswordModal').classList.add('active');
  const loginEmail = document.getElementById('loginEmail').value.trim();
  if (loginEmail) document.getElementById('resetEmail').value = loginEmail;
}

function closeForgotPasswordModal() {
  document.getElementById('forgotPasswordModal').classList.remove('active');
}

async function handleForgotPassword(e) {
  e.preventDefault();
  const btn = document.getElementById('btnSendReset');
  const email = document.getElementById('resetEmail').value.trim();
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    if (error) {
      showToast('Error: ' + error.message, 'error');
    } else {
      showToast('Se ha enviado un correo con instrucciones para restablecer tu contraseña.', 'success');
      closeForgotPasswordModal();
    }
  } catch (err) {
    console.error(err);
    showToast('Error al procesar la solicitud.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar Enlace';
  }
}
  </script>
