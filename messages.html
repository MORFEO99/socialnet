<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusNet — Canal de Consultas y Chat</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
/* ================================================================
   CAMPUSNET — PLATAFORMA ACADÉMICA Y SOCIAL DEL CURSO
   Diseño oscuro moderno, paleta índigo/esmeralda y glassmorphism
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg-page:        #0B0F19;
  --bg-panel:       #111827;
  --bg-card:        #162032;
  --bg-card-hover:  #1B283E;
  --bg-input:       #1E293B;
  --bg-hover:       #243248;
  --bg-modal:       #131D2D;

  --indigo:         #6366F1;
  --indigo-dark:    #4F46E5;
  --indigo-glow:    rgba(99,102,241,0.28);
  --emerald:        #10B981;
  --emerald-glow:   rgba(16,185,129,0.25);
  --amber:          #F59E0B;
  --amber-glow:     rgba(245,158,11,0.25);
  --rose:           #F43F5E;
  --rose-glow:      rgba(244,63,94,0.25);
  --sky:            #0EA5E9;

  --text-1:         #F8FAFC;
  --text-2:         #94A3B8;
  --text-3:         #64748B;

  --border:         rgba(255,255,255,0.08);
  --border-strong:  rgba(255,255,255,0.14);
  --border-glow:    rgba(99,102,241,0.4);

  --shadow-sm:      0 1px 3px rgba(0,0,0,0.5);
  --shadow-md:      0 4px 18px rgba(0,0,0,0.55);
  --shadow-lg:      0 14px 45px rgba(0,0,0,0.65);
  --shadow-glow:    0 0 25px var(--indigo-glow);

  --radius-sm:      8px;
  --radius-md:      12px;
  --radius-lg:      16px;
  --radius-xl:      22px;

  --navbar-h:       64px;
  --transition:     all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-page);
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

a { color: var(--indigo); text-decoration: none; transition: var(--transition); }
a:hover { text-decoration: none; opacity: 0.9; }
button { cursor: pointer; border: none; outline: none; font-family: inherit; }
input, textarea, select { font-family: inherit; }
img { max-width: 100%; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-panel); }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--indigo); }

/* ── Navbar ──────────────────────────────────────────────────────── */
.navbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--navbar-h);
  background: rgba(17, 24, 39, 0.88);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 1.5rem;
  z-index: 1000;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  gap: 1.25rem;
}

.nav-brand {
  display: flex; align-items: center; gap: 0.75rem;
  text-decoration: none; flex-shrink: 0; min-width: 210px;
}
.brand-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--indigo) 0%, #3B82F6 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.25rem; color: white; flex-shrink: 0;
  box-shadow: var(--shadow-glow);
}
.brand-titles { display: flex; flex-direction: column; }
.brand-name {
  font-size: 1.15rem; font-weight: 800; color: #fff;
  letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.4rem;
}
.brand-sub {
  font-size: 0.68rem; font-weight: 600; color: var(--indigo);
  text-transform: uppercase; letter-spacing: 0.08em;
}

.nav-tabs {
  display: flex; align-items: center; gap: 0.4rem;
  flex: 1; justify-content: center;
}
.nav-tab {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 1.1rem; height: 42px;
  border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 0.88rem; font-weight: 600;
  transition: var(--transition); text-decoration: none; position: relative;
}
.nav-tab i { font-size: 1.05rem; }
.nav-tab:hover { background: var(--bg-hover); color: var(--text-1); }
.nav-tab.active {
  color: #fff; background: rgba(99, 102, 241, 0.15);
  border: 1px solid rgba(99, 102, 241, 0.35);
}
.nav-tab.active::after {
  content: ''; position: absolute; bottom: -12px; left: 20%; right: 20%;
  height: 2px; background: var(--indigo); border-radius: 2px;
}
@media(max-width: 768px){
  .nav-tab span { display: none; }
  .nav-tab { padding: 0.5rem 0.85rem; }
  .brand-titles { display: none; }
}

.nav-badge {
  background: var(--rose); color: white;
  font-size: 0.65rem; font-weight: 800;
  min-width: 18px; height: 18px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px;
}

.nav-right {
  display: flex; align-items: center; gap: 0.75rem;
  min-width: 210px; justify-content: flex-end;
}
.nav-profile-link {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.35rem 0.65rem; border-radius: 999px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  transition: var(--transition);
}
.nav-profile-link:hover {
  background: var(--bg-hover); border-color: var(--border-glow);
}
.nav-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--indigo);
}
.nav-user-info { display: flex; flex-direction: column; text-align: left; }
.nav-user-name { font-size: 0.82rem; font-weight: 700; color: var(--text-1); line-height: 1.2; }
.nav-user-role { font-size: 0.68rem; color: var(--text-2); }
@media(max-width: 900px){
  .nav-user-info { display: none; }
}

.btn-icon {
  width: 38px; height: 38px; background: var(--bg-hover);
  border-radius: var(--radius-sm); display: flex; align-items: center;
  justify-content: center; color: var(--text-2);
  font-size: 0.95rem; transition: var(--transition); flex-shrink: 0;
  border: 1px solid var(--border);
}
.btn-icon:hover { background: var(--bg-card); color: var(--text-1); border-color: var(--border-strong); }

/* ── Botones ─────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.5rem; padding: 0.55rem 1.15rem;
  border-radius: var(--radius-sm);
  font-size: 0.88rem; font-weight: 600;
  transition: var(--transition); border: none; cursor: pointer;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-dark) 100%);
  color: white; box-shadow: 0 2px 10px rgba(79, 70, 229, 0.35);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #7175f7 0%, #5850ec 100%);
  box-shadow: 0 4px 18px rgba(79, 70, 229, 0.5);
}
.btn-secondary {
  background: var(--bg-hover); color: var(--text-1);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-1); }
.btn-danger { background: var(--rose); color: white; }
.btn-danger:hover { background: #e11d48; }
.btn-block { width: 100%; }
.btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; border-radius: 6px; }
.btn-lg { padding: 0.8rem 1.5rem; font-size: 1rem; border-radius: 10px; }

/* ── Layout ──────────────────────────────────────────────────────── */
.page-wrapper { padding-top: var(--navbar-h); min-height: 100vh; }
.container-feed { max-width: 1020px; margin: 0 auto; padding: 1.75rem 1rem; display: flex; gap: 1.5rem; align-items: flex-start; }
.feed-main { flex: 1; min-width: 0; }
.feed-sidebar { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1.25rem; }
@media(max-width: 960px){
  .container-feed { flex-direction: column; }
  .feed-sidebar { width: 100%; }
}
.container-wide { max-width: 1020px; margin: 0 auto; padding: 1.75rem 1rem; }

.card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden;
  box-shadow: var(--shadow-sm); transition: var(--transition);
}
.card:hover { border-color: rgba(255,255,255,0.12); }

/* ── Banner del Curso ────────────────────────────────────────────── */
.course-banner {
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(17, 24, 39, 0.95) 100%),
              radial-gradient(ellipse at top right, rgba(99, 102, 241, 0.25) 0%, transparent 60%);
  border: 1px solid rgba(99, 102, 241, 0.3);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem; margin-bottom: 1.25rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  position: relative; overflow: hidden;
}
.course-banner::before {
  content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
  background: linear-gradient(to bottom, var(--indigo), var(--emerald));
}
.course-banner-info h2 { font-size: 1.25rem; font-weight: 800; color: #fff; margin-bottom: 0.2rem; }
.course-banner-info p { font-size: 0.85rem; color: var(--text-2); display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.course-tag {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.2rem 0.6rem; border-radius: 999px;
  font-size: 0.72rem; font-weight: 700;
  background: rgba(99, 102, 241, 0.15); color: #A5B4FC;
  border: 1px solid rgba(99, 102, 241, 0.3);
}

/* ── Filtros del Tablón ──────────────────────────────────────────── */
.filter-tabs-wrap {
  display: flex; gap: 0.5rem; overflow-x: auto;
  padding-bottom: 0.75rem; margin-bottom: 1.25rem;
  scrollbar-width: none;
}
.filter-tabs-wrap::-webkit-scrollbar { display: none; }
.filter-pill {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.45rem 0.95rem; border-radius: 999px;
  background: var(--bg-panel); border: 1px solid var(--border);
  color: var(--text-2); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: var(--transition); white-space: nowrap;
}
.filter-pill:hover { background: var(--bg-hover); color: var(--text-1); }
.filter-pill.active {
  background: var(--indigo); color: white; border-color: var(--indigo);
  box-shadow: 0 2px 10px var(--indigo-glow);
}

/* ── Badges ──────────────────────────────────────────────────────── */
.badge-category {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.22rem 0.65rem; border-radius: 6px;
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em;
}
.cat-aviso    { background: rgba(245,158,11,0.15); color: #FBBF24; border: 1px solid rgba(245,158,11,0.3); }
.cat-duda     { background: rgba(244,63,94,0.15);  color: #FDA4AF; border: 1px solid rgba(244,63,94,0.3); }
.cat-material { background: rgba(14,165,233,0.15); color: #7DD3FC; border: 1px solid rgba(14,165,233,0.3); }
.cat-proyecto { background: rgba(16,185,129,0.15); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.3); }
.cat-general  { background: rgba(99,102,241,0.15); color: #C7D2FE; border: 1px solid rgba(99,102,241,0.3); }

/* Badges de Roles */
.badge-docente {
  font-size: 0.68rem; font-weight: 800; color: #FBBF24;
  background: rgba(245,158,11,0.15); padding: 2px 8px; border-radius: 999px;
  border: 1px solid rgba(245,158,11,0.35); display: inline-flex; align-items: center; gap: 0.3rem;
  box-shadow: 0 0 10px rgba(245,158,11,0.2);
}
.badge-alumno {
  font-size: 0.68rem; font-weight: 700; color: var(--emerald);
  background: rgba(16,185,129,0.12); padding: 1px 7px; border-radius: 999px;
  border: 1px solid rgba(16,185,129,0.25); display: inline-flex; align-items: center; gap: 0.3rem;
}

/* ── Creador de Publicaciones ────────────────────────────────────── */
.post-creator {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); padding: 1.25rem; margin-bottom: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.post-creator-top { display: flex; align-items: center; gap: 0.75rem; }
.post-creator-top img {
  width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  border: 2px solid var(--indigo);
}
.post-creator-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.65rem 1.25rem;
  color: var(--text-3); font-size: 0.92rem; cursor: pointer;
  transition: var(--transition); display: flex; align-items: center; gap: 0.5rem;
}
.post-creator-input:hover { border-color: var(--border-glow); color: var(--text-2); }

.post-creator-expanded { display: none; flex-direction: column; gap: 0.9rem; margin-top: 0.75rem; }
.post-creator-expanded.active { display: flex; }
.post-creator-expanded textarea {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 0.85rem 1rem;
  color: var(--text-1); font-size: 0.95rem; resize: none; outline: none;
  min-height: 95px; line-height: 1.6; transition: var(--transition);
}
.post-creator-expanded textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-glow); }

.category-selector-title { font-size: 0.78rem; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }
.category-options { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.cat-choice {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.35rem 0.75rem; border-radius: 999px;
  background: var(--bg-input); border: 1px solid var(--border);
  font-size: 0.78rem; font-weight: 600; color: var(--text-2);
  cursor: pointer; transition: var(--transition); user-select: none;
}
.cat-choice:hover { border-color: var(--border-strong); color: var(--text-1); }
.cat-choice.selected {
  background: var(--indigo); color: white; border-color: var(--indigo);
  box-shadow: 0 2px 8px var(--indigo-glow);
}

.post-image-preview {
  position: relative; border-radius: var(--radius-md); overflow: hidden; max-height: 240px;
}
.post-image-preview img { width: 100%; max-height: 240px; object-fit: cover; display: block; }
.post-image-preview .remove-img {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,0.75); color: white;
  border-radius: 50%; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; cursor: pointer; transition: var(--transition);
}
.post-image-preview .remove-img:hover { background: var(--rose); }

.post-creator-actions {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); padding-top: 0.85rem; flex-wrap: wrap; gap: 0.5rem;
}
.post-media-actions { display: flex; gap: 0.35rem; }
.btn-media {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.4rem 0.8rem; border-radius: var(--radius-sm);
  font-size: 0.82rem; font-weight: 600;
  color: var(--text-2); background: var(--bg-input); transition: var(--transition);
  border: 1px solid var(--border);
}
.btn-media:hover { background: var(--bg-hover); color: var(--text-1); border-color: var(--border-strong); }

/* ── Tarjeta de Publicación ──────────────────────────────────────── */
.post-card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); margin-bottom: 1.25rem;
  overflow: hidden; animation: fadeInUp 0.35s ease;
  box-shadow: var(--shadow-sm); transition: var(--transition);
}
.post-card:hover { border-color: rgba(255,255,255,0.13); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.post-header {
  display: flex; align-items: center; gap: 0.85rem;
  padding: 1rem 1.25rem 0.6rem;
}
.post-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0; cursor: pointer;
  border: 2px solid rgba(255,255,255,0.1); transition: var(--transition);
}
.post-avatar:hover { border-color: var(--indigo); }
.post-meta { flex: 1; min-width: 0; }
.post-author-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.post-author { font-weight: 700; font-size: 0.94rem; color: var(--text-1); cursor: pointer; }
.post-author:hover { color: var(--indigo); }
.post-time { font-size: 0.76rem; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 0.4rem; }

.post-content { padding: 0.5rem 1.25rem 0.85rem; }
.post-content p { font-size: 0.96rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; color: #E2E8F0; }

.post-image {
  width: 100%; max-height: 520px; object-fit: cover; display: block;
  cursor: pointer; transition: var(--transition);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.post-image:hover { opacity: 0.95; }

.post-stats {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5rem 1.25rem; font-size: 0.8rem; color: var(--text-3);
  border-bottom: 1px solid var(--border);
}

.post-actions { display: flex; padding: 0.35rem 0.75rem; }
.btn-post-action {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.45rem;
  padding: 0.55rem; font-size: 0.85rem; font-weight: 600;
  color: var(--text-2); background: transparent;
  border-radius: var(--radius-sm); transition: var(--transition);
}
.btn-post-action:hover { background: var(--bg-hover); color: var(--text-1); }
.btn-post-action.liked { color: var(--rose); }

/* ── Comentarios ─────────────────────────────────────────────────── */
.comments-section {
  padding: 1rem 1.25rem; border-top: 1px solid var(--border);
  background: rgba(17, 24, 39, 0.4); display: none;
}
.comments-section.active { display: block; }
.comment-input-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.9rem; }
.comment-input-row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.comment-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.5rem 1.1rem; color: var(--text-1);
  font-size: 0.88rem; outline: none; transition: var(--transition);
}
.comment-input:focus { border-color: var(--indigo); box-shadow: 0 0 0 2px var(--indigo-glow); }

.comment-item { display: flex; gap: 0.6rem; margin-bottom: 0.7rem; }
.comment-item img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.comment-bubble {
  background: var(--bg-input); border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
  padding: 0.6rem 0.9rem; flex: 1; border: 1px solid var(--border);
}
.comment-author { font-weight: 700; font-size: 0.82rem; margin-bottom: 2px; color: var(--text-1); display: flex; align-items: center; gap: 0.4rem; }
.comment-text { font-size: 0.88rem; color: var(--text-2); line-height: 1.5; word-break: break-word; }
.comment-time { font-size: 0.7rem; color: var(--text-3); margin-top: 4px; }

/* ── Widget Lateral ──────────────────────────────────────────────── */
.sidebar-widget {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); padding: 1.25rem;
}
.widget-title {
  font-size: 0.92rem; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
}
.event-item {
  display: flex; gap: 0.75rem; align-items: flex-start;
  padding: 0.75rem 0; border-bottom: 1px solid var(--border);
}
.event-item:last-child { border-bottom: none; padding-bottom: 0; }
.event-date {
  background: rgba(99, 102, 241, 0.15); color: var(--indigo);
  border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 8px;
  padding: 0.35rem 0.5rem; text-align: center; min-width: 44px; flex-shrink: 0;
}
.event-date .day { font-size: 1.05rem; font-weight: 800; line-height: 1; }
.event-date .month { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
.event-info h4 { font-size: 0.85rem; font-weight: 700; color: var(--text-1); margin-bottom: 2px; }
.event-info p { font-size: 0.75rem; color: var(--text-3); }

/* ── Historias ───────────────────────────────────────────────────── */
.stories-bar {
  display: flex; gap: 0.75rem; overflow-x: auto;
  padding: 0.85rem; background: var(--bg-card);
  border-radius: var(--radius-lg); border: 1px solid var(--border);
  margin-bottom: 1.25rem; scrollbar-width: none;
}
.stories-bar::-webkit-scrollbar { display: none; }
.story-item {

// =====================================================================
// CAMPUSNET — CLIENTE DE SUPABASE Y UTILIDADES GLOBALES
// =====================================================================

const SUPABASE_URL = 'https://sqslyuhrfjvspsupjylh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DasYg9xJ23y5AfZMXDAl_w_xkLuMTFw';

if (typeof supabase === 'undefined') {
  console.error('La librería @supabase/supabase-js no está cargada.');
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

window.sb = sb;

async function getCurrentUser() {
  const { data: { session }, error } = await sb.auth.getSession();
  if (error || !session) return null;
  return session.user;
}

async function getProfile(userId) {
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', userId)
    .single();

  if (error) {
    console.warn('No se encontró perfil:', error.message);
    return null;
  }
  return data;
}

function isDocenteProfile(profile) {
  if (!profile) return false;
  const bio = (profile.bio || '').toLowerCase();
  const username = (profile.username || '').toLowerCase();
  return bio.includes('[docente]') || bio.includes('[profesor]') || username.startsWith('profesor') || username.startsWith('docente');
}

async function uploadMedia(file, folder = 'posts') {
  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${folder}/${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;

    const { data, error } = await sb.storage
      .from('media')
      .upload(fileName, file, { cacheControl: '3600', upsert: false });

    if (error) {
      return await fileToBase64(file);
    }
    const { data: publicUrlData } = sb.storage.from('media').getPublicUrl(fileName);
    return publicUrlData.publicUrl;
  } catch (err) {
    return await fileToBase64(file);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

function timeAgo(dateString) {
  if (!dateString) return '';
  const date = new Date(dateString);
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);

  if (seconds < 60) return 'Hace un momento';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `Hace ${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `Hace ${hours} h`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `Hace ${days} d`;
  return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

function showToast(message, type = 'info') {
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(30px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

async function requireAuth() {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = 'index.html';
    return null;
  }
  return user;
}

async function redirectIfAuth() {
  const user = await getCurrentUser();
  if (user) {
    window.location.href = 'feed.html';
  }
}

  if (!currentUser) return;

  const profile = await getProfile(currentUser.id);
  if (profile?.avatar_url) document.getElementById('navAvatar').src = profile.avatar_url;

  await loadContacts();
  setupRealtimeMessages();
});

async function loadContacts() {
  const listEl = document.getElementById('contactsList');
  const { data: profiles, error } = await sb
    .from('profiles')
    .select('id, username, full_name, avatar_url, bio')
    .neq('id', currentUser.id)
    .order('full_name', { ascending: true });

  if (error || !profiles || profiles.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><p>No hay otros integrantes registrados aún.</p></div>';
    return;
  }

  // Ordenar para que los docentes aparezcan primero
  profiles.sort((a, b) => {
    const aDoc = isDocenteProfile(a);
    const bDoc = isDocenteProfile(b);
    if (aDoc && !bDoc) return -1;
    if (!aDoc && bDoc) return 1;
    return 0;
  });

  allContacts = profiles;
  renderContactsList(profiles);
}

function renderContactsList(contacts) {
  const listEl = document.getElementById('contactsList');
  listEl.innerHTML = contacts.map(c => {
    const isDoc = isDocenteProfile(c);
    const badgeHtml = isDoc
      ? '<span class="badge-docente" style="font-size:0.6rem;padding:1px 5px;"><i class="fa-solid fa-crown"></i> Docente</span>'
      : '';

    return `
      <div class="contact-item ${c.id === activeContactId ? 'active' : ''}" onclick="selectContact('${c.id}')" id="contact-${c.id}">
        <div class="contact-avatar-wrap">
          <img src="${c.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="contact-avatar" alt="${c.full_name}">
          <span class="online-dot"></span>
        </div>
        <div class="contact-info">
          <div class="contact-name">
            <span>${c.full_name || c.username}</span>
            ${badgeHtml}
          </div>
          <div class="contact-preview">${c.bio || '@' + c.username}</div>
        </div>
      </div>
    `;
  }).join('');
}

function filterContacts(query) {
  const q = query.toLowerCase();
  const filtered = allContacts.filter(c => 
    (c.full_name && c.full_name.toLowerCase().includes(q)) ||
    (c.username && c.username.toLowerCase().includes(q))
  );
  renderContactsList(filtered);
}

async function selectContact(contactId) {
  activeContactId = contactId;
  const contact = allContacts.find(c => c.id === contactId);
  if (!contact) return;

  document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
  const currentItem = document.getElementById(`contact-${contactId}`);
  if (currentItem) currentItem.classList.add('active');

  document.getElementById('noChatPlaceholder').style.display = 'none';
  const chatArea = document.getElementById('activeChatArea');
  chatArea.style.display = 'flex';

  const isDoc = isDocenteProfile(contact);
  document.getElementById('chatHeaderAvatar').src = contact.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
  document.getElementById('chatHeaderName').innerHTML = `
    <span>${contact.full_name || contact.username}</span>
    ${isDoc ? '<span class="badge-docente"><i class="fa-solid fa-crown"></i> Docente</span>' : '<span class="badge-alumno">Alumno</span>'}
  `;
  document.getElementById('chatHeaderProfileLink').href = `profile.html?id=${contact.id}`;

  await loadMessages();
}

async function loadMessages() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';

  const { data: messages, error } = await sb
    .from('messages')
    .select('*')
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeContactId}),and(sender_id.eq.${activeContactId},receiver_id.eq.${currentUser.id})`)
    .order('created_at', { ascending: true });

  if (error) {
    container.innerHTML = '<div class="empty-state"><p>Error al cargar mensajes.</p></div>';
    return;
  }

  renderMessages(messages || []);
}

function renderMessages(messages) {
  const container = document.getElementById('chatMessages');
  if (messages.length === 0) {
    container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-comments"></i><p>Inicia la conversación académica con tu compañero o docente.</p></div>';
    return;
  }

  container.innerHTML = messages.map(m => {
    const isMine = m.sender_id === currentUser.id;
    return `
      <div class="msg-row ${isMine ? 'mine' : ''}">
        <div class="msg-bubble">
          ${escapeHtml(m.content)}
        </div>
      </div>
    `;
  }).join('');

  container.scrollTop = container.scrollHeight;
}

async function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !activeContactId) return;

  input.value = '';
  const { error } = await sb.from('messages').insert({
    sender_id: currentUser.id,
    receiver_id: activeContactId,
    content: text
  });

  if (!error) {
    await loadMessages();
  }
}

function setupRealtimeMessages() {
  sb.channel('public:messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      const msg = payload.new;
      if (
        (msg.sender_id === activeContactId && msg.receiver_id === currentUser.id) ||
        (msg.sender_id === currentUser.id && msg.receiver_id === activeContactId)
      ) {
        loadMessages();
      }
    })
    .subscribe();
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
  </script>
</body>
