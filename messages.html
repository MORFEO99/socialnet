<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialNet — Mensajes Directos</title>

  <!-- Estilos y Fuentes -->
  <style>
/* ================================================================
   SOCIALNET — ESTILOS GLOBALES
   Diseño oscuro premium con glassmorphism e Inter font
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

/* ── Variables ──────────────────────────────────────────────────── */
:root {
  --bg-page:      #0E0F13;
  --bg-panel:     #1A1B1F;
  --bg-card:      #22232A;
  --bg-input:     #2A2B33;
  --bg-hover:     #2E2F38;
  --bg-modal:     #1E1F26;

  --blue:         #1877F2;
  --blue-hover:   #166FE5;
  --blue-glow:    rgba(24,119,242,0.28);
  --green:        #42B72A;
  --red:          #E41E3F;
  --yellow:       #F5C518;

  --text-1:       #E8E9ED;
  --text-2:       #9A9DA8;
  --text-3:       #60626D;

  --border:       rgba(255,255,255,0.07);
  --shadow-sm:    0 1px 3px rgba(0,0,0,.4);
  --shadow-md:    0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:    0 12px 40px rgba(0,0,0,.6);

  --radius-sm:    8px;
  --radius-md:    12px;
  --radius-lg:    16px;
  --radius-xl:    20px;

  --navbar-h:     60px;
  --transition:   all 0.2s ease;
}

/* ── Reset ──────────────────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }

body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg-page);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

a { color:var(--blue); text-decoration:none; }
a:hover { text-decoration:underline; }
button { cursor:pointer; border:none; outline:none; font-family:inherit; }
input,textarea,select { font-family:inherit; }
img { max-width:100%; }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg-panel); }
::-webkit-scrollbar-thumb { background:var(--bg-hover); border-radius:999px; }
::-webkit-scrollbar-thumb:hover { background:var(--bg-input); }

/* ── Navbar ─────────────────────────────────────────────────────── */
.navbar {
  position:fixed; top:0; left:0; right:0;
  height:var(--navbar-h);
  background:rgba(26,27,31,0.92);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center;
  padding:0 1.25rem;
  z-index:1000;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  gap:1rem;
}

.nav-brand {
  display:flex; align-items:center; gap:0.5rem;
  font-size:1.4rem; font-weight:800;
  color:var(--blue); text-decoration:none;
  flex-shrink:0; min-width:180px;
}
.nav-brand:hover { text-decoration:none; }
.nav-brand .brand-icon {
  width:36px; height:36px;
  background:var(--blue); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1.2rem; font-weight:900; color:white; flex-shrink:0;
  box-shadow:0 0 20px var(--blue-glow);
}
.nav-brand span { display:none; }
@media(min-width:640px){ .nav-brand span { display:inline; } }

.nav-tabs {
  display:flex; align-items:center; gap:0.25rem;
  flex:1; justify-content:center;
}
.nav-tab {
  display:flex; align-items:center; justify-content:center;
  width:100px; height:44px;
  border-radius:var(--radius-sm);
  color:var(--text-2);
  font-size:1.3rem;
  transition:var(--transition);
  text-decoration:none; position:relative;
}
.nav-tab:hover { background:var(--bg-hover); color:var(--text-1); text-decoration:none; }
.nav-tab.active { color:var(--blue); }
.nav-tab.active::after {
  content:''; position:absolute;
  bottom:-15px; left:0; right:0; height:3px;
  background:var(--blue); border-radius:3px 3px 0 0;
}
@media(max-width:480px){ .nav-tab { width:56px; } }

.nav-badge {
  position:absolute; top:6px; right:12px;
  background:var(--red); color:white;
  font-size:0.62rem; font-weight:700;
  min-width:18px; height:18px; border-radius:999px;
  display:flex; align-items:center; justify-content:center;
  padding:0 4px;
}

.nav-right {
  display:flex; align-items:center; gap:0.5rem;
  min-width:180px; justify-content:flex-end;
}

.nav-avatar {
  width:36px; height:36px; border-radius:50%;
  object-fit:cover; cursor:pointer;
  border:2px solid transparent; transition:var(--transition);
}
.nav-avatar:hover { border-color:var(--blue); }

.btn-icon {
  width:40px; height:40px; background:var(--bg-hover);
  border-radius:50%; display:flex; align-items:center;
  justify-content:center; color:var(--text-1);
  font-size:1rem; transition:var(--transition); flex-shrink:0;
}
.btn-icon:hover { background:var(--bg-input); }

/* ── Buttons ────────────────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; justify-content:center;
  gap:0.4rem; padding:0.5rem 1.1rem;
  border-radius:var(--radius-sm);
  font-size:0.9rem; font-weight:600;
  transition:var(--transition); border:none; cursor:pointer;
}
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--blue); color:white; }
.btn-primary:hover { background:var(--blue-hover); }
.btn-secondary { background:var(--bg-hover); color:var(--text-1); }
.btn-secondary:hover { background:var(--bg-input); }
.btn-ghost { background:transparent; color:var(--text-2); }
.btn-ghost:hover { background:var(--bg-hover); color:var(--text-1); }
.btn-danger { background:var(--red); color:white; }
.btn-danger:hover { background:#c9193a; }
.btn-block { width:100%; }
.btn-sm { padding:0.35rem 0.75rem; font-size:0.82rem; }
.btn-lg { padding:0.75rem 1.5rem; font-size:1rem; }

/* ── Page wrapper ───────────────────────────────────────────────── */
.page-wrapper { padding-top:var(--navbar-h); min-height:100vh; }
.container-feed { max-width:640px; margin:0 auto; padding:1.5rem 1rem; }
.container-wide { max-width:1100px; margin:0 auto; padding:1.5rem 1rem; }

/* ── Card ───────────────────────────────────────────────────────── */
.card {
  background:var(--bg-card); border-radius:var(--radius-lg);
  border:1px solid var(--border); overflow:hidden;
  transition:var(--transition);
}
.card:hover { border-color:rgba(255,255,255,0.11); }

/* ── Form controls ──────────────────────────────────────────────── */
.form-control {
  width:100%; background:var(--bg-input);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text-1); padding:0.65rem 1rem;
  font-size:0.95rem; transition:var(--transition); outline:none;
}
.form-control:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-glow); }
.form-control::placeholder { color:var(--text-3); }
textarea.form-control { resize:none; }
.form-label { display:block; font-size:0.85rem; font-weight:500; color:var(--text-2); margin-bottom:0.4rem; }
.form-group { margin-bottom:1rem; }
.form-input-wrap { position:relative; }
.form-input-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--text-3); font-size:0.9rem; }
.form-input-wrap .form-control { padding-left:2.5rem; }

/* ── Stories ────────────────────────────────────────────────────── */
.stories-bar {
  display:flex; gap:0.65rem; overflow-x:auto;
  padding:0.75rem; background:var(--bg-card);
  border-radius:var(--radius-lg); border:1px solid var(--border);
  margin-bottom:1rem; scrollbar-width:none;
}
.stories-bar::-webkit-scrollbar { display:none; }

.story-item {
  flex-shrink:0; width:100px; height:162px;
  border-radius:var(--radius-md); overflow:hidden;
  position:relative; cursor:pointer;
  transition:var(--transition);
}
.story-item:hover { transform:scale(1.04); }
.story-item .story-avatar {
  position:absolute; top:8px; left:8px;
  width:36px; height:36px; border-radius:50%;
  border:3px solid var(--blue); object-fit:cover;
}
.story-item .story-name {
  position:absolute; bottom:0; left:0; right:0;
  padding:1.5rem 6px 8px;
  background:linear-gradient(transparent,rgba(0,0,0,.75));
  font-size:0.72rem; font-weight:600;
  color:white; text-align:center;
}
.story-add {
  flex-shrink:0; width:100px; height:162px;
  border-radius:var(--radius-md);
  background:var(--bg-hover); border:2px dashed rgba(255,255,255,.15);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer; gap:0.4rem; transition:var(--transition);
  font-size:0.75rem; font-weight:500; color:var(--text-2);
}
.story-add:hover { border-color:var(--blue); color:var(--blue); }
.story-add .add-icon {
  width:38px; height:38px; background:var(--blue);
  border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:1.2rem; color:white;
}

/* ── Post Creator ───────────────────────────────────────────────── */
.post-creator {
  background:var(--bg-card); border-radius:var(--radius-lg);
  border:1px solid var(--border); padding:1rem; margin-bottom:1rem;
}
.post-creator-top {
  display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem;
}
.post-creator-top img {
  width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0;
}
.post-creator-input {
  flex:1; background:var(--bg-input); border:1px solid var(--border);
  border-radius:999px; padding:0.6rem 1.2rem;
  color:var(--text-3); font-size:0.95rem; cursor:pointer;
  transition:var(--transition);
}
.post-creator-input:hover { border-color:rgba(255,255,255,.15); color:var(--text-2); }

.post-creator-expanded { display:none; flex-direction:column; gap:0.75rem; }
.post-creator-expanded.active { display:flex; }
.post-creator-expanded textarea {
  width:100%; background:transparent; border:none;
  color:var(--text-1); font-size:1.05rem;
  resize:none; outline:none; min-height:80px; line-height:1.6;
}

.post-creator-actions {
  display:flex; align-items:center; justify-content:space-between;
  border-top:1px solid var(--border); padding-top:0.75rem; flex-wrap:wrap; gap:.5rem;
}
.post-media-actions { display:flex; gap:0.25rem; flex-wrap:wrap; }

.btn-media {
  display:flex; align-items:center; gap:0.35rem;
  padding:0.4rem 0.75rem; border-radius:var(--radius-sm);
  font-size:0.85rem; font-weight:500;
  color:var(--text-2); background:transparent; transition:var(--transition);
}
.btn-media:hover { background:var(--bg-hover); color:var(--text-1); }
.btn-media.photo { color:#45BD62; }
.btn-media.feeling { color:var(--yellow); }

.post-image-preview {
  position:relative; border-radius:var(--radius-md); overflow:hidden; max-height:220px;
}
.post-image-preview img { width:100%; max-height:220px; object-fit:cover; display:block; }
.post-image-preview .remove-img {
  position:absolute; top:8px; right:8px;
  background:rgba(0,0,0,.65); color:white;
  border-radius:50%; width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.85rem; cursor:pointer; transition:var(--transition);
}
.post-image-preview .remove-img:hover { background:rgba(0,0,0,.85); }

/* ── Post Card ──────────────────────────────────────────────────── */
.post-card {
  background:var(--bg-card); border-radius:var(--radius-lg);
  border:1px solid var(--border); margin-bottom:1rem;
  overflow:hidden; animation:fadeInUp 0.35s ease;
}
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}

.post-header {
  display:flex; align-items:center; gap:0.75rem;
  padding:0.9rem 1rem 0.5rem;
}
.post-avatar {
  width:42px; height:42px; border-radius:50%;
  object-fit:cover; flex-shrink:0; cursor:pointer;
  transition:var(--transition);
}
.post-avatar:hover { opacity:.85; }

.post-meta { flex:1; min-width:0; }
.post-author { font-weight:600; font-size:0.92rem; cursor:pointer; }
.post-author:hover { color:var(--blue); }
.post-time { font-size:0.76rem; color:var(--text-3); margin-top:1px; }

.post-content { padding:0.4rem 1rem 0.6rem; }
.post-content p { font-size:0.97rem; line-height:1.65; white-space:pre-wrap; word-break:break-word; }

.post-image {
  width:100%; max-height:520px; object-fit:cover; display:block;
  cursor:pointer; transition:var(--transition);
}
.post-image:hover { opacity:.93; }

.post-stats {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.4rem 1rem; font-size:0.8rem; color:var(--text-3);
}
.post-reactions { display:flex; gap:0.2rem; align-items:center; }

.post-actions {
  display:flex; border-top:1px solid var(--border); margin:0 0.5rem;
}
.btn-post-action {
  flex:1; display:flex; align-items:center; justify-content:center; gap:0.4rem;
  padding:0.55rem; font-size:0.84rem; font-weight:600;
  color:var(--text-2); background:transparent;
  border-radius:var(--radius-sm); transition:var(--transition);
}
.btn-post-action:hover { background:var(--bg-hover); color:var(--text-1); }
.btn-post-action.liked { color:var(--red); }

/* ── Comments ───────────────────────────────────────────────────── */
.comments-section {
  padding:0.75rem 1rem; border-top:1px solid var(--border);
  display:none;
}
.comments-section.active { display:block; }

.comment-input-row {
  display:flex; align-items:center; gap:0.5rem; margin-bottom:0.8rem;
}
.comment-input-row img { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.comment-input {
  flex:1; background:var(--bg-input);
  border:1px solid var(--border); border-radius:999px;
  padding:0.45rem 1rem; color:var(--text-1); font-size:0.88rem;
  outline:none; transition:var(--transition);
}
.comment-input:focus { border-color:var(--blue); }

.comment-item { display:flex; gap:0.5rem; margin-bottom:0.55rem; }
.comment-item img { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.comment-bubble { background:var(--bg-input); border-radius:0 var(--radius-md) var(--radius-md) var(--radius-md); padding:0.5rem 0.8rem; flex:1; }
.comment-author { font-weight:600; font-size:0.81rem; margin-bottom:2px; }
.comment-text { font-size:0.87rem; color:var(--text-2); line-height:1.5; }
.comment-time { font-size:0.7rem; color:var(--text-3); margin-top:3px; }

/* ── Spinner & States ───────────────────────────────────────────── */
.spinner {
  width:32px; height:32px;
  border:3px solid var(--border); border-top-color:var(--blue);
  border-radius:50%; animation:spin 0.75s linear infinite; margin:0 auto;
}
@keyframes spin { to { transform:rotate(360deg); } }

.loading-state { text-align:center; padding:2rem; color:var(--text-3); }
.empty-state { text-align:center; padding:3rem 1rem; color:var(--text-3); font-size:0.9rem; }
.empty-state i { font-size:2.5rem; margin-bottom:0.75rem; display:block; opacity:.5; }

/* ── Toast ──────────────────────────────────────────────────────── */
.toast-container {
  position:fixed; bottom:1.5rem; right:1.5rem;
  z-index:9999; display:flex; flex-direction:column; gap:0.5rem;
  pointer-events:none;
}
.toast {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:0.75rem 1rem;
  font-size:0.87rem; color:var(--text-1); box-shadow:var(--shadow-md);
  animation:slideInRight 0.3s ease; max-width:310px; pointer-events:auto;
}
.toast.success { border-left:3px solid var(--green); }
.toast.error   { border-left:3px solid var(--red); }
.toast.info    { border-left:3px solid var(--blue); }
@keyframes slideInRight {
  from { opacity:0; transform:translateX(24px); }
  to   { opacity:1; transform:translateX(0); }
}

/* ── Messages Layout ────────────────────────────────────────────── */
.messages-layout {
  display:flex; height:calc(100vh - var(--navbar-h)); overflow:hidden;
}

.contacts-panel {
  width:320px; flex-shrink:0; background:var(--bg-panel);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
@media(max-width:640px){
  .contacts-panel { width:260px; }
}
@media(max-width:480px){
  .contacts-panel {
    position:fixed; left:0; top:var(--navbar-h); bottom:0;
    z-index:200; transform:translateX(-100%); transition:transform .3s ease;
    width:280px;
  }
  .contacts-panel.open { transform:translateX(0); }
}

.contacts-header { padding:1.25rem 1rem 0.75rem; border-bottom:1px solid var(--border); flex-shrink:0; }
.contacts-header h2 { font-size:1.2rem; font-weight:700; }
.contacts-search { padding:0.65rem 0.75rem; flex-shrink:0; }
.contacts-list { flex:1; overflow-y:auto; padding:0.35rem; }

.contact-item {
  display:flex; align-items:center; gap:0.7rem;
  padding:0.6rem 0.65rem; border-radius:var(--radius-md);
  cursor:pointer; transition:var(--transition);
}
.contact-item:hover,.contact-item.active { background:var(--bg-hover); }

.contact-avatar-wrap { position:relative; flex-shrink:0; }
.contact-avatar { width:46px; height:46px; border-radius:50%; object-fit:cover; }
.online-dot {
  position:absolute; bottom:1px; right:1px;
  width:12px; height:12px; background:var(--green);
  border-radius:50%; border:2px solid var(--bg-panel);
}

.contact-info { flex:1; min-width:0; }
.contact-name { font-weight:600; font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.contact-preview { font-size:0.76rem; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.contact-meta { flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:0.3rem; }
.contact-time { font-size:0.7rem; color:var(--text-3); }
.unread-badge {
  background:var(--blue); color:white;
  border-radius:999px; font-size:0.68rem; font-weight:700;
  padding:0 6px; min-width:18px; height:18px;
  display:flex; align-items:center; justify-content:center;
}

/* ── Chat Panel ─────────────────────────────────────────────────── */
.chat-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }

.chat-header {
  display:flex; align-items:center; gap:0.75rem;
  padding:0.85rem 1.25rem; background:var(--bg-panel);
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.chat-header-name { font-weight:600; font-size:0.95rem; }
.chat-header-status { font-size:0.76rem; color:var(--green); }

.chat-messages {
  flex:1; overflow-y:auto; padding:1rem;
  display:flex; flex-direction:column; gap:0.45rem;
  background:var(--bg-page);
}

.msg-row { display:flex; gap:0.5rem; }
.msg-row.mine { flex-direction:row-reverse; }
.msg-row img { width:30px; height:30px; border-radius:50%; object-fit:cover; flex-shrink:0; align-self:flex-end; }

.msg-bubble {
  max-width:62%; padding:0.6rem 0.9rem;
  border-radius:var(--radius-md); font-size:0.9rem; line-height:1.5;
  word-break:break-word;
}
.msg-row.mine .msg-bubble {
  background:var(--blue); color:white;
  border-radius:var(--radius-md) var(--radius-md) 4px var(--radius-md);
}
.msg-row:not(.mine) .msg-bubble {
  background:var(--bg-card); color:var(--text-1);
  border-radius:var(--radius-md) var(--radius-md) var(--radius-md) 4px;
}

.msg-time { font-size:0.68rem; color:var(--text-3); text-align:center; margin:0.5rem 0; }

.chat-input-bar {
  padding:0.75rem 1rem; background:var(--bg-panel);
  border-top:1px solid var(--border);
  display:flex; align-items:center; gap:0.6rem; flex-shrink:0;
}
.chat-input {
  flex:1; background:var(--bg-input);
  border:1px solid var(--border); border-radius:999px;
  padding:0.62rem 1.1rem; color:var(--text-1);
  font-size:0.9rem; outline:none; transition:var(--transition);
}
.chat-input:focus { border-color:var(--blue); }

.chat-no-contact {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:100%; color:var(--text-3); gap:0.75rem; text-align:center;
  padding:2rem;
}
.chat-no-contact i { font-size:3rem; opacity:.4; }

/* ── Profile ────────────────────────────────────────────────────── */
.profile-cover {
  height:240px;
  background:linear-gradient(135deg,#1877F2 0%,#42B72A 100%);
  position:relative; overflow:hidden;
}
.profile-cover img { width:100%; height:100%; object-fit:cover; }

.profile-info-bar {
  display:flex; align-items:flex-end; gap:1rem;
  padding:0 1.5rem; margin-top:-3rem; margin-bottom:1rem; flex-wrap:wrap;
}

.profile-avatar-wrap { position:relative; flex-shrink:0; }
.profile-avatar {
  width:110px; height:110px; border-radius:50%;
  object-fit:cover; border:4px solid var(--bg-page);
  background:var(--bg-card); display:block;
}
.profile-avatar-edit {
  position:absolute; bottom:4px; right:4px;
  width:30px; height:30px; background:var(--bg-hover);
  border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:0.8rem; cursor:pointer;

// =====================================================================
// SOCIALNET — CONFIGURACIÓN Y CLIENTE DE SUPABASE
// =====================================================================

const SUPABASE_URL = 'https://jumnvlulddknolirblxh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Xhh5UXZBhpyGzjYg_nwEpw_8d7637fu';

// Inicializar cliente oficial de Supabase
if (typeof supabase === 'undefined') {
  console.error('La librería @supabase/supabase-js no está cargada.');
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

// Guardar referencia global
window.sb = sb;

// ── UTILIDADES GLOBALES ──────────────────────────────────────────────

/**
 * Obtener la sesión y usuario actual
 */
async function getCurrentUser() {
  const { data: { session }, error } = await sb.auth.getSession();
  if (error || !session) return null;
  return session.user;
}

/**
 * Obtener el perfil público del usuario
 */
async function getProfile(userId) {
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', userId)
    .single();

  if (error) {
    console.warn('No se encontró perfil:', error.message);
    return null;
  }
  return data;
}

/**
 * Subir imagen al bucket 'media' de Supabase Storage
 */
async function uploadMedia(file, folder = 'posts') {
  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${folder}/${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;

    const { data, error } = await sb.storage
      .from('media')
      .upload(fileName, file, {
        cacheControl: '3600',
        upsert: false
      });

    if (error) {
      console.warn('Error subiendo imagen a Storage:', error.message);
      // Si el bucket no existe o falla, intentar convertir a Base64 como fallback
      return await fileToBase64(file);
    }

    // Obtener URL pública
    const { data: publicUrlData } = sb.storage
      .from('media')
      .getPublicUrl(fileName);

    return publicUrlData.publicUrl;
  } catch (err) {
    console.warn('Excepción en uploadMedia:', err);
    return await fileToBase64(file);
  }
}

/**
 * Convertir archivo a base64 (fallback en caso de que Storage no esté configurado)
 */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

/**
 * Formateador de tiempo relativo (ej: "Hace 5 minutos")
 */
function timeAgo(dateString) {
  if (!dateString) return '';
  const date = new Date(dateString);
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);

  if (seconds < 60) return 'Hace un momento';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `Hace ${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `Hace ${hours} h`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `Hace ${days} d`;
  
  return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

/**
 * Mostrar notificaciones tipo Toast
 */
function showToast(message, type = 'info') {
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(30px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

/**
 * Cerrar sesión
 */
async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

/**
 * Proteger páginas privadas: Si no hay sesión, va al Login
 */
async function requireAuth() {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = 'index.html';
    return null;
  }
  return user;
}

/**
 * Para index.html: Si ya está logueado, va directo al feed
 */
async function redirectIfAuth() {
  const user = await getCurrentUser();
  if (user) {
    window.location.href = 'feed.html';
  }
}

  <script>
// =====================================================================
// SOCIALNET — CHAT EN TIEMPO REAL (MESSENGER)
// =====================================================================

let currentUser = null;
let currentProfile = null;
let activeContact = null;
let allContacts = [];
let messagesChannel = null;

document.addEventListener('DOMContentLoaded', async () => {
  // 1. Verificar sesión activa
  currentUser = await requireAuth();
  if (!currentUser) return;

  // 2. Cargar perfil del usuario actual
  currentProfile = await getProfile(currentUser.id);
  const navAvatar = document.getElementById('navAvatar');
  if (navAvatar && currentProfile?.avatar_url) {
    navAvatar.src = currentProfile.avatar_url;
  }

  // 3. Cargar lista de contactos / usuarios de Supabase
  await loadContacts();

  // 4. Suscribirse a mensajes en tiempo real
  setupRealtimeMessages();

  // 5. Si hay un parámetro ?chat=userId en la URL, abrirlo directamente
  const urlParams = new URLSearchParams(window.location.search);
  const targetUserId = urlParams.get('chat');
  if (targetUserId) {
    const targetContact = allContacts.find(c => c.id === targetUserId);
    if (targetContact) {
      selectContact(targetContact);
    }
  }

  // Ajustes para pantalla móvil
  window.addEventListener('resize', handleResponsiveLayout);
  handleResponsiveLayout();
});

// ── CARGAR LISTA DE CONTACTOS ────────────────────────────────────────

async function loadContacts() {
  const container = document.getElementById('contactsList');

  try {
    // Consultar todos los perfiles excepto el propio
    const { data: profiles, error } = await sb
      .from('profiles')
      .select('*')
      .neq('id', currentUser.id)
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Error cargando contactos:', error);
      container.innerHTML = `<div class="empty-state"><p>Error al cargar usuarios.</p></div>`;
      return;
    }

    allContacts = profiles || [];

    if (allContacts.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="padding:1.5rem 0.5rem;">
          <i class="fa-solid fa-user-group"></i>
          <p style="font-size:0.85rem;">Aún no hay otros usuarios registrados.</p>
          <small style="color:var(--text-3);display:block;margin-top:0.4rem;">Registra otra cuenta desde una ventana de incógnito para probar el chat en vivo.</small>
        </div>
      `;
      return;
    }

    renderContactsList(allContacts);

  } catch (err) {
    console.error(err);
    container.innerHTML = `<div class="empty-state"><p>Error de conexión.</p></div>`;
  }
}

function renderContactsList(contacts) {
  const container = document.getElementById('contactsList');
  if (contacts.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding:1.5rem 0.5rem;"><p>No se encontraron usuarios.</p></div>`;
    return;
  }

  container.innerHTML = contacts.map(c => `
    <div class="contact-item ${activeContact && activeContact.id === c.id ? 'active' : ''}" id="contact-item-${c.id}" onclick="selectContactById('${c.id}')">
      <div class="contact-avatar-wrap">
        <img src="${c.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="contact-avatar" alt="${escapeHtml(c.full_name || c.username)}">
        <span class="online-dot"></span>
      </div>
      <div class="contact-info">
        <div class="contact-name">${escapeHtml(c.full_name || c.username)}</div>
        <div class="contact-preview">@${escapeHtml(c.username)}</div>
      </div>
    </div>
  `).join('');
}

function filterContacts(query) {
  const q = query.toLowerCase().trim();
  if (!q) {
    renderContactsList(allContacts);
    return;
  }
  const filtered = allContacts.filter(c => 
    (c.full_name && c.full_name.toLowerCase().includes(q)) ||
    (c.username && c.username.toLowerCase().includes(q))
  );
  renderContactsList(filtered);
}

function selectContactById(id) {
  const contact = allContacts.find(c => c.id === id);
  if (contact) {
    selectContact(contact);
  }
}

// ── SELECCIONAR CONTACTO Y ABRIR CHAT ────────────────────────────────

async function selectContact(contact) {
  activeContact = contact;

  // Actualizar clase activa en la lista
  document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById(`contact-item-${contact.id}`);
  if (activeEl) activeEl.classList.add('active');

  // Mostrar área de chat y ocultar estado vacío
  document.getElementById('noChatPlaceholder').style.display = 'none';
  const chatArea = document.getElementById('activeChatArea');
  chatArea.style.display = 'flex';

  // Configurar encabezado del chat
  document.getElementById('chatHeaderAvatar').src = contact.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
  document.getElementById('chatHeaderName').textContent = contact.full_name || contact.username;
  document.getElementById('chatHeaderProfileLink').href = `profile.html?user=${contact.id}`;

  // Si estamos en móvil, cerrar el panel de contactos
  if (window.innerWidth <= 640) {
    document.getElementById('contactsPanel').classList.remove('open');
    document.getElementById('btnBackToContacts').style.display = 'flex';
  }

  // Cargar historial de mensajes
  await loadMessagesHistory();

  // Enfocar el input
  document.getElementById('messageInput').focus();
}

function closeMobileChat() {
  document.getElementById('contactsPanel').classList.add('open');
}

function handleResponsiveLayout() {
  const backBtn = document.getElementById('btnBackToContacts');
  if (window.innerWidth <= 640) {
    if (activeContact && backBtn) backBtn.style.display = 'flex';
  } else {
    if (backBtn) backBtn.style.display = 'none';
    document.getElementById('contactsPanel').classList.remove('open');
  }
}

// ── HISTORIAL DE MENSAJES ────────────────────────────────────────────

async function loadMessagesHistory() {
  if (!activeContact) return;
  const container = document.getElementById('chatMessages');
  container.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
    </div>`;

  try {
    // Traer mensajes donde (yo envié y él recibió) O (él envió y yo recibí)
    const { data: messages, error } = await sb
      .from('messages')
      .select('*')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeContact.id}),and(sender_id.eq.${activeContact.id},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true });

    if (error) {
      console.error('Error cargando mensajes:', error);
      container.innerHTML = `<div class="empty-state"><p>Error al cargar la conversación.</p></div>`;
      return;
    }

    if (!messages || messages.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="margin:auto;">
          <img src="${activeContact.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" style="width:64px;height:64px;border-radius:50%;margin-bottom:0.5rem;object-fit:cover;">
          <h4 style="color:var(--text-1);">${escapeHtml(activeContact.full_name || activeContact.username)}</h4>
          <p style="font-size:0.85rem;color:var(--text-3);margin-top:2px;">Envía un saludo para iniciar la conversación.</p>
        </div>`;
      return;
    }

    container.innerHTML = messages.map(msg => renderMessageBubble(msg)).join('');
    scrollToBottom();

    // Marcar como leídos los que me enviaron
    await sb
      .from('messages')
      .update({ read: true })
      .eq('sender_id', activeContact.id)
      .eq('receiver_id', currentUser.id)
      .eq('read', false);

  } catch (err) {
    console.error(err);
    container.innerHTML = `<div class="empty-state"><p>Error de conexión.</p></div>`;
  }
}

function renderMessageBubble(msg) {
  const isMine = msg.sender_id === currentUser.id;
  const avatar = isMine 
    ? (currentProfile?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150')
    : (activeContact?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150');

  const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  return `
    <div class="msg-row ${isMine ? 'mine' : ''}" id="msg-${msg.id}">
      <img src="${avatar}" alt="Avatar">
      <div style="display:flex; flex-direction:column; align-items:${isMine ? 'flex-end' : 'flex-start'};">
        <div class="msg-bubble">
          ${escapeHtml(msg.content)}
        </div>
        <span style="font-size:0.65rem;color:var(--text-3);margin-top:2px;padding:0 4px;">${timeStr}</span>
      </div>
    </div>
  `;
}

function scrollToBottom() {
  const container = document.getElementById('chatMessages');
  if (container) {
    container.scrollTop = container.scrollHeight;
  }
}

// ── ENVIAR MENSAJE ───────────────────────────────────────────────────

async function sendMessage(e) {
  e.preventDefault();
  if (!activeContact) return;

  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  if (!content) return;

  input.value = '';

  // Inserción optimista en el chat
  const tempMsg = {
    id: 'temp_' + Date.now(),
    sender_id: currentUser.id,
    receiver_id: activeContact.id,
    content: content,
    created_at: new Date().toISOString()
  };

  const container = document.getElementById('chatMessages');
  // Si estaba el estado vacío, limpiarlo
  if (container.querySelector('.empty-state')) {
    container.innerHTML = '';
  }
  container.insertAdjacentHTML('beforeend', renderMessageBubble(tempMsg));
  scrollToBottom();

  try {
    const { data, error } = await sb
      .from('messages')
      .insert({
        sender_id: currentUser.id,
        receiver_id: activeContact.id,
        content: content
      })
      .select('*')
      .single();

    if (error) {
      showToast('Error al enviar el mensaje: ' + error.message, 'error');
    }
  } catch (err) {
    console.error(err);
    showToast('Error de red al enviar mensaje.', 'error');
  }
}

// ── REALTIME: ESCUCHAR MENSAJES EN TIEMPO REAL ────────────────────────

function setupRealtimeMessages() {
  messagesChannel = sb
    .channel('public:messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      const newMsg = payload.new;
      if (!newMsg) return;

      // 1. Si el mensaje es para la conversación activa actualmente
      if (activeContact && (
        (newMsg.sender_id === activeContact.id && newMsg.receiver_id === currentUser.id) ||
        (newMsg.sender_id === currentUser.id && newMsg.receiver_id === activeContact.id)
      )) {
        // Evitar duplicar si fue el mensaje temporal que ya pintamos
        const container = document.getElementById('chatMessages');
        if (newMsg.sender_id !== currentUser.id) {
          if (container.querySelector('.empty-state')) {
            container.innerHTML = '';
          }
          container.insertAdjacentHTML('beforeend', renderMessageBubble(newMsg));
          scrollToBottom();

          // Marcar como leído
          sb.from('messages').update({ read: true }).eq('id', newMsg.id);
        }
      } 
      // 2. Si el mensaje me lo envió alguien más que no tengo abierto en este momento
      else if (newMsg.receiver_id === currentUser.id) {
        const sender = allContacts.find(c => c.id === newMsg.sender_id);
        const senderName = sender ? (sender.full_name || sender.username) : 'Nuevo mensaje';
        showToast(`💬 <b>${escapeHtml(senderName)}:</b> ${escapeHtml(newMsg.content.substring(0, 35))}`, 'info');
      }
    })
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
