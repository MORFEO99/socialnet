<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusNet — Canal de Consultas y Chat</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
/* ================================================================
   CAMPUSNET — PLATAFORMA ACADÉMICA CON PALETA VIBRANTE Y LUMINOSA
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --bg-page:        #0E1424;
  --bg-panel:       #151F36;
  --bg-card:        rgba(26, 38, 66, 0.85);
  --bg-card-hover:  rgba(35, 50, 86, 0.95);
  --bg-input:       #1E2C4D;
  --bg-hover:       #2A3C66;
  --bg-modal:       #162038;

  --indigo:         #6366F1;
  --purple:         #8B5CF6;
  --pink:           #EC4899;
  --cyan:           #06B6D4;
  --emerald:        #10B981;
  --amber:          #F59E0B;
  --rose:           #F43F5E;

  --text-1:         #FFFFFF;
  --text-2:         #CBD5E1;
  --text-3:         #94A3B8;

  --border:         rgba(255, 255, 255, 0.14);
  --border-strong:  rgba(255, 255, 255, 0.25);
  --border-glow:    rgba(99, 102, 241, 0.55);

  --shadow-sm:      0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-md:      0 8px 26px rgba(0, 0, 0, 0.45);
  --shadow-lg:      0 18px 50px rgba(0, 0, 0, 0.6);
  --shadow-glow:    0 0 25px rgba(99, 102, 241, 0.4);

  --radius-sm:      10px;
  --radius-md:      14px;
  --radius-lg:      20px;
  --radius-xl:      26px;

  --navbar-h:       68px;
  --transition:     all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-page);
  background-image: 
    radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.32) 0%, transparent 45%),
    radial-gradient(circle at 90% 15%, rgba(6, 182, 212, 0.28) 0%, transparent 42%),
    radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
    radial-gradient(circle at 80% 85%, rgba(236, 72, 153, 0.25) 0%, transparent 45%),
    radial-gradient(circle at 15% 90%, rgba(16, 185, 129, 0.25) 0%, transparent 45%);
  background-attachment: fixed;
  background-size: cover;
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
  overflow-x: hidden;
}

a { color: var(--cyan); text-decoration: none; transition: var(--transition); }
a:hover { text-decoration: none; color: #67E8F9; }
button { cursor: pointer; border: none; outline: none; font-family: inherit; }
input, textarea, select { font-family: inherit; }
img { max-width: 100%; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-panel); }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--indigo); }

/* ── Animaciones ─────────────────────────────────────────────────── */
@keyframes floatSlow {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
  50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.6); }
}

@keyframes pulseGreen {
  0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
  70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.96) translateY(14px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── Navbar ──────────────────────────────────────────────────────── */
.navbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--navbar-h);
  background: rgba(21, 31, 54, 0.88);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 1.75rem;
  z-index: 1000;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  gap: 1.25rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.nav-brand {
  display: flex; align-items: center; gap: 0.85rem;
  text-decoration: none; flex-shrink: 0; min-width: 210px;
}
.brand-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; color: white; flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
  animation: floatSlow 3.8s ease-in-out infinite;
}
.brand-titles { display: flex; flex-direction: column; }
.brand-name {
  font-size: 1.25rem; font-weight: 900; color: #fff;
  letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.4rem;
}
.brand-sub {
  font-size: 0.7rem; font-weight: 800; color: var(--cyan);
  text-transform: uppercase; letter-spacing: 0.1em;
}

.nav-tabs {
  display: flex; align-items: center; gap: 0.6rem;
  flex: 1; justify-content: center;
}
.nav-tab {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.6rem 1.25rem; height: 46px;
  border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 0.92rem; font-weight: 700;
  transition: var(--transition); text-decoration: none; position: relative;
}
.nav-tab i { font-size: 1.15rem; }
.nav-tab:hover { background: var(--bg-hover); color: #fff; transform: translateY(-1px); }
.nav-tab.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.25) 0%, rgba(236, 72, 153, 0.25) 100%);
  border: 1px solid rgba(236, 72, 153, 0.45);
  box-shadow: 0 4px 18px rgba(99, 102, 241, 0.25);
}
.nav-tab.active::after {
  content: ''; position: absolute; bottom: -12px; left: 15%; right: 15%;
  height: 3px; background: linear-gradient(90deg, #6366F1, #EC4899);
  border-radius: 3px;
}
@media(max-width: 768px){
  .nav-tab span { display: none; }
  .nav-tab { padding: 0.5rem 0.85rem; }
  .brand-titles { display: none; }
}

.nav-badge {
  background: linear-gradient(135deg, #EC4899, #F43F5E); color: white;
  font-size: 0.68rem; font-weight: 900;
  min-width: 20px; height: 20px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; box-shadow: 0 2px 8px rgba(236, 72, 153, 0.5);
}

.nav-right {
  display: flex; align-items: center; gap: 0.85rem;
  min-width: 210px; justify-content: flex-end;
}
.nav-profile-link {
  display: flex; align-items: center; gap: 0.7rem;
  padding: 0.4rem 0.85rem; border-radius: 999px;
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  transition: var(--transition);
}
.nav-profile-link:hover {
  background: var(--bg-hover); border-color: var(--cyan);
  transform: translateY(-1px); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
}
.nav-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--cyan);
}
.nav-user-info { display: flex; flex-direction: column; text-align: left; }
.nav-user-name { font-size: 0.86rem; font-weight: 800; color: var(--text-1); line-height: 1.2; }
.nav-user-role { font-size: 0.7rem; color: var(--emerald); font-weight: 700; }
@media(max-width: 900px){
  .nav-user-info { display: none; }
}

.btn-icon {
  width: 42px; height: 42px; background: var(--bg-hover);
  border-radius: var(--radius-sm); display: flex; align-items: center;
  justify-content: center; color: var(--text-2);
  font-size: 1.05rem; transition: var(--transition); flex-shrink: 0;
  border: 1px solid var(--border);
}
.btn-icon:hover {
  background: var(--bg-card); color: #fff;
  border-color: var(--cyan); transform: translateY(-1px);
  box-shadow: 0 2px 10px rgba(6, 182, 212, 0.25);
}

/* ── Botones ─────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.6rem; padding: 0.65rem 1.35rem;
  border-radius: var(--radius-sm);
  font-size: 0.9rem; font-weight: 700;
  transition: var(--transition); border: none; cursor: pointer;
  white-space: nowrap; position: relative; overflow: hidden;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
  color: white; box-shadow: 0 4px 18px rgba(236, 72, 153, 0.45);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #7175f7 0%, #9a6df7 50%, #f45ca7 100%);
  box-shadow: 0 6px 26px rgba(236, 72, 153, 0.6);
  transform: translateY(-2px);
}
.btn-secondary {
  background: var(--bg-hover); color: var(--text-1);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background: var(--bg-card-hover); border-color: var(--cyan); color: #fff;
  transform: translateY(-1px); box-shadow: 0 4px 14px rgba(6, 182, 212, 0.25);
}
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--bg-hover); color: #fff; }
.btn-danger { background: linear-gradient(135deg, #F43F5E, #E11D48); color: white; box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4); }
.btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(244, 63, 94, 0.55); }
.btn-block { width: 100%; }
.btn-sm { padding: 0.45rem 1rem; font-size: 0.84rem; border-radius: 9px; }
.btn-lg { padding: 0.9rem 1.75rem; font-size: 1.02rem; border-radius: 14px; }

/* ── Layout ──────────────────────────────────────────────────────── */
.page-wrapper { padding-top: var(--navbar-h); min-height: 100vh; }
.container-feed { max-width: 1080px; margin: 0 auto; padding: 2.2rem 1.25rem; display: flex; gap: 1.85rem; align-items: flex-start; }
.feed-main { flex: 1; min-width: 0; }
.feed-sidebar { width: 330px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1.45rem; }
@media(max-width: 960px){
  .container-feed { flex-direction: column; }
  .feed-sidebar { width: 100%; }
}
.container-wide { max-width: 1080px; margin: 0 auto; padding: 2.2rem 1.25rem; }

/* ── Tarjetas ────────────────────────────────────────────────────── */
.card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden;
  box-shadow: var(--shadow-md); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: var(--transition);
}
.card:hover {
  border-color: rgba(255,255,255,0.22);
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(0,0,0,0.55);
}

/* ── Hero Banner del Curso con Gradiente Luminoso ─────────────────── */
.course-banner {
  background: 
    linear-gradient(135deg, rgba(30, 44, 76, 0.95) 0%, rgba(20, 29, 52, 0.98) 100%),
    radial-gradient(circle at top right, rgba(236, 72, 153, 0.35) 0%, rgba(99, 102, 241, 0.3) 50%, transparent 80%);
  border: 1px solid rgba(236, 72, 153, 0.45);
  border-radius: var(--radius-xl);
  padding: 1.8rem 2rem; margin-bottom: 1.6rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1.35rem;
  position: relative; overflow: hidden;
  box-shadow: 0 12px 35px rgba(0,0,0,0.45), 0 0 35px rgba(99, 102, 241, 0.25);
  animation: popIn 0.4s ease-out;
}
.course-banner::before {
  content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
  background: linear-gradient(to bottom, #EC4899, #8B5CF6, #06B6D4, #10B981);
}
.course-banner-info h2 {
  font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 0.4rem;
  letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap;
}
.course-banner-info p {
  font-size: 0.9rem; color: var(--text-2); font-weight: 500;
  display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
}
.course-tag {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.3rem 0.85rem; border-radius: 999px;
  font-size: 0.78rem; font-weight: 800;
  background: rgba(16, 185, 129, 0.22); color: #6EE7B7;
  border: 1px solid rgba(16, 185, 129, 0.45);
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
}

/* ── Filtros ─────────────────────────────────────────────────────── */
.filter-tabs-wrap {
  display: flex; gap: 0.65rem; overflow-x: auto;
  padding-bottom: 0.85rem; margin-bottom: 1.45rem;
  scrollbar-width: none;
}
.filter-tabs-wrap::-webkit-scrollbar { display: none; }
.filter-pill {
  display: inline-flex; align-items: center; gap: 0.55rem;
  padding: 0.55rem 1.15rem; border-radius: 999px;
  background: rgba(22, 32, 56, 0.9); border: 1px solid var(--border);
  color: var(--text-2); font-size: 0.88rem; font-weight: 700;
  cursor: pointer; transition: var(--transition); white-space: nowrap;
}
.filter-pill:hover { background: var(--bg-hover); color: #fff; transform: translateY(-1px); border-color: var(--cyan); }
.filter-pill.active {
  background: linear-gradient(135deg, #6366F1, #8B5CF6); color: white; border-color: #8B5CF6;
  box-shadow: 0 4px 18px rgba(99, 102, 241, 0.45); transform: translateY(-1px);
}

/* ── Badges de Categorías VIBRANTES ──────────────────────────────── */
.badge-category {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.3rem 0.8rem; border-radius: 10px;
  font-size: 0.74rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em;
}
.cat-aviso    { background: rgba(245,158,11,0.25); color: #FDE68A; border: 1px solid #F59E0B; box-shadow: 0 0 10px rgba(245,158,11,0.25); }
.cat-duda     { background: rgba(236,72,153,0.25); color: #FCE7F3; border: 1px solid #EC4899; box-shadow: 0 0 10px rgba(236,72,153,0.25); }
.cat-material { background: rgba(6,182,212,0.25);  color: #CFFAFE; border: 1px solid #06B6D4; box-shadow: 0 0 10px rgba(6,182,212,0.25); }
.cat-proyecto { background: rgba(16,185,129,0.25); color: #D1FAE5; border: 1px solid #10B981; box-shadow: 0 0 10px rgba(16,185,129,0.25); }
.cat-general  { background: rgba(99,102,241,0.25); color: #E0E7FF; border: 1px solid #6366F1; box-shadow: 0 0 10px rgba(99,102,241,0.25); }

.badge-docente {
  font-size: 0.72rem; font-weight: 800; color: #FEF08A;
  background: linear-gradient(135deg, rgba(245,158,11,0.3), rgba(236,72,153,0.25));
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid #F59E0B; display: inline-flex; align-items: center; gap: 0.4rem;
  box-shadow: 0 0 14px rgba(245,158,11,0.35);
}
.badge-alumno {
  font-size: 0.72rem; font-weight: 700; color: #A7F3D0;
  background: rgba(16,185,129,0.2); padding: 2px 9px; border-radius: 999px;
  border: 1px solid #10B981; display: inline-flex; align-items: center; gap: 0.35rem;
}

/* ── Tarjetas de Inicio Rápido COLORIDAS ─────────────────────────── */
.starter-cards-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.15rem; margin-top: 1.45rem;
}
@media(max-width: 700px){ .starter-cards-grid { grid-template-columns: 1fr; } }

.starter-card {
  background: rgba(30, 44, 76, 0.75); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 1.45rem 1.15rem; text-align: center;
  cursor: pointer; transition: var(--transition); display: flex; flex-direction: column;
  align-items: center; gap: 0.75rem;
}
.starter-card:hover {
  background: var(--bg-card-hover); border-color: var(--cyan);
  transform: translateY(-5px); box-shadow: 0 12px 28px rgba(6, 182, 212, 0.25);
}
.starter-icon {
  width: 52px; height: 52px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.55rem; margin-bottom: 0.3rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.starter-card h4 { font-size: 1rem; font-weight: 800; color: #fff; }
.starter-card p { font-size: 0.82rem; color: var(--text-2); line-height: 1.45; }

/* ── Creador de Publicaciones ────────────────────────────────────── */
.post-creator {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); padding: 1.45rem; margin-bottom: 1.6rem;
  box-shadow: var(--shadow-md); backdrop-filter: blur(20px);
}
.post-creator-top { display: flex; align-items: center; gap: 0.95rem; }
.post-creator-top img {
  width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  border: 2px solid var(--cyan); box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
}
.post-creator-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.8rem 1.45rem;
  color: var(--text-2); font-size: 0.95rem; font-weight: 500; cursor: pointer;
  transition: var(--transition); display: flex; align-items: center; gap: 0.65rem;
}
.post-creator-input:hover {
  border-color: var(--cyan); color: #fff;
  background: var(--bg-hover); transform: translateY(-1px);
  box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
}

.post-creator-expanded { display: none; flex-direction: column; gap: 1.1rem; margin-top: 0.95rem; animation: popIn 0.25s ease-out; }
.post-creator-expanded.active { display: flex; }
.post-creator-expanded textarea {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 1rem 1.2rem;
  color: var(--text-1); font-size: 0.98rem; resize: none; outline: none;
  min-height: 105px; line-height: 1.6; transition: var(--transition);
}
.post-creator-expanded textarea:focus {
  border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.35);
  background: rgba(30, 44, 76, 0.95);
}

.category-selector-title { font-size: 0.82rem; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; }
.category-options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.cat-choice {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.45rem 0.95rem; border-radius: 999px;
  background: var(--bg-input); border: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 700; color: var(--text-2);
  cursor: pointer; transition: var(--transition); user-select: none;
}
.cat-choice:hover { border-color: var(--cyan); color: #fff; transform: translateY(-1px); }
.cat-choice.selected {
  background: linear-gradient(135deg, #6366F1, #8B5CF6); color: white; border-color: #8B5CF6;
  box-shadow: 0 2px 12px rgba(99, 102, 241, 0.45); transform: translateY(-1px);
}

.post-image-preview {
  position: relative; border-radius: var(--radius-md); overflow: hidden; max-height: 260px;
}
.post-image-preview img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
.post-image-preview .remove-img {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,0.85); color: white;
  border-radius: 50%; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; cursor: pointer; transition: var(--transition);
}
.post-image-preview .remove-img:hover { background: var(--rose); transform: scale(1.1); }

.post-creator-actions {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); padding-top: 1rem; flex-wrap: wrap; gap: 0.65rem;
}
.post-media-actions { display: flex; gap: 0.5rem; }
.btn-media {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 0.95rem; border-radius: var(--radius-sm);
  font-size: 0.86rem; font-weight: 700;
  color: var(--text-2); background: var(--bg-input); transition: var(--transition);
  border: 1px solid var(--border);
}
.btn-media:hover {
  background: var(--bg-hover); color: #fff;
  border-color: var(--cyan); transform: translateY(-1px);
}

/* ── Tarjetas de Publicación ─────────────────────────────────────── */
.post-card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  border: 1px solid var(--border); margin-bottom: 1.5rem;
  overflow: hidden; animation: popIn 0.35s ease;
  box-shadow: var(--shadow-md); backdrop-filter: blur(20px);
  transition: var(--transition);
}
.post-card:hover {
  border-color: rgba(255,255,255,0.2);
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
}

.post-header {
  display: flex; align-items: center; gap: 0.95rem;
  padding: 1.2rem 1.45rem 0.65rem;
}
.post-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0; cursor: pointer;

  </header>

  <div class="page-wrapper" style="padding-top:var(--navbar-h); height:100vh;">
    <div class="messages-layout">

      <!-- Panel Izquierdo -->
      <aside class="contacts-panel" id="contactsPanel">
        <div class="contacts-header">
          <h2>Directorio del Curso</h2>
          <span class="badge-category cat-general" style="font-size:0.7rem;">Comunidad</span>
        </div>

        <div class="contacts-search">
          <div class="form-input-wrap">
            <i class="fa-solid fa-magnifying-glass form-input-icon"></i>
            <input type="text" id="searchContactsInput" class="form-control" placeholder="Buscar compañero o docente..." oninput="filterContacts(this.value)">
          </div>
        </div>

        <div class="contacts-list" id="contactsList">
          <div class="loading-state">
            <div class="spinner"></div>
            <p style="margin-top:0.5rem;font-size:0.84rem;">Cargando directorio...</p>
          </div>
        </div>
      </aside>

      <!-- Panel Derecho: Conversación -->
      <section class="chat-panel" id="chatPanel">
        <div id="noChatPlaceholder" class="chat-no-contact">
          <i class="fa-solid fa-comments"></i>
          <h3 style="color:#fff;font-weight:900;font-size:1.35rem;">Consultas de Estudio</h3>
          <p style="max-width:420px;line-height:1.55;color:var(--text-2);">Selecciona a un docente o compañero de la lista izquierda para coordinar tareas o resolver dudas en privado.</p>
        </div>

        <div id="activeChatArea" style="display:none; flex-direction:column; height:100%;">
          <div class="chat-header">
            <div class="contact-avatar-wrap">
              <img id="chatHeaderAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="nav-avatar" alt="Avatar">
              <span class="online-dot"></span>
            </div>
            <div style="flex:1; min-width:0;">
              <div id="chatHeaderName" class="chat-header-name">
                <span>Usuario</span>
                <span id="chatHeaderBadge"></span>
              </div>
              <div class="chat-header-status">
                <i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> Conectado al curso
              </div>
            </div>
            <a id="chatHeaderProfileLink" href="profile.html" class="btn btn-secondary btn-sm" title="Ver ficha académica">
              <i class="fa-solid fa-id-badge" style="color:var(--cyan);"></i> Ver Ficha
            </a>
          </div>

          <div class="chat-messages" id="chatMessages"></div>

          <form class="chat-input-bar" onsubmit="sendMessage(event)">
            <input type="text" id="messageInput" class="chat-input" placeholder="Escribe un mensaje, duda o apunte..." autocomplete="off" required>
            <button type="submit" id="btnSendMessage" class="btn btn-primary" style="border-radius:50%;width:44px;height:44px;padding:0;flex-shrink:0;">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </section>

    </div>
  </div>

  <script>
// =====================================================================
// CAMPUSNET — CLIENTE DE SUPABASE Y UTILIDADES GLOBALES
// =====================================================================

const SUPABASE_URL = 'https://sqslyuhrfjvspsupjylh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DasYg9xJ23y5AfZMXDAl_w_xkLuMTFw';

if (typeof supabase === 'undefined') {
  console.error('La librería @supabase/supabase-js no está cargada.');
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

window.sb = sb;

async function getCurrentUser() {
  const { data: { session }, error } = await sb.auth.getSession();
  if (error || !session) return null;
  return session.user;
}

async function getProfile(userId) {
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', userId)
    .single();

  if (error) {
    console.warn('No se encontró perfil:', error.message);
    return null;
  }
  return data;
}

function isDocenteProfile(profile) {
  if (!profile) return false;
  const bio = (profile.bio || '').toLowerCase();
  const username = (profile.username || '').toLowerCase();
  return bio.includes('[docente]') || bio.includes('[profesor]') || username.startsWith('profesor') || username.startsWith('docente');
}

async function uploadMedia(file, folder = 'posts') {
  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${folder}/${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;

    const { data, error } = await sb.storage
      .from('media')
      .upload(fileName, file, { cacheControl: '3600', upsert: false });

    if (error) {
      return await fileToBase64(file);
    }
    const { data: publicUrlData } = sb.storage.from('media').getPublicUrl(fileName);
    return publicUrlData.publicUrl;
  } catch (err) {
    return await fileToBase64(file);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

function timeAgo(dateString) {
  if (!dateString) return '';
  const date = new Date(dateString);
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);

  if (seconds < 60) return 'Hace un momento';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `Hace ${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `Hace ${hours} h`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `Hace ${days} d`;
  return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

function showToast(message, type = 'info') {
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(30px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

async function requireAuth() {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = 'index.html';
    return null;
  }
  return user;
}

async function redirectIfAuth() {
  const user = await getCurrentUser();
  if (user) {
    window.location.href = 'feed.html';
  }
}

  </script>
  <script>
let currentUser = null;
let activeContactId = null;
let allContacts = [];

document.addEventListener('DOMContentLoaded', async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;

  const profile = await getProfile(currentUser.id);
  if (profile?.avatar_url) document.getElementById('navAvatar').src = profile.avatar_url;

  await loadContacts();
  setupRealtimeMessages();
});

async function loadContacts() {
  const listEl = document.getElementById('contactsList');
  const { data: profiles, error } = await sb
    .from('profiles')
    .select('id, username, full_name, avatar_url, bio')
    .neq('id', currentUser.id)
    .order('full_name', { ascending: true });

  if (error || !profiles || profiles.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><p>No hay otros integrantes registrados aún.</p></div>';
    return;
  }

  profiles.sort((a, b) => {
    const aDoc = isDocenteProfile(a);
    const bDoc = isDocenteProfile(b);
    if (aDoc && !bDoc) return -1;
    if (!aDoc && bDoc) return 1;
    return 0;
  });

  allContacts = profiles;
  renderContactsList(profiles);
}

function renderContactsList(contacts) {
  const listEl = document.getElementById('contactsList');
  listEl.innerHTML = contacts.map(c => {
    const isDoc = isDocenteProfile(c);
    const badgeHtml = isDoc
      ? '<span class="badge-docente" style="font-size:0.62rem;padding:1px 6px;"><i class="fa-solid fa-crown"></i> Docente</span>'
      : '';

    return `
      <div class="contact-item ${c.id === activeContactId ? 'active' : ''}" onclick="selectContact('${c.id}')" id="contact-${c.id}">
        <div class="contact-avatar-wrap">
          <img src="${c.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="contact-avatar" alt="${c.full_name}">
          <span class="online-dot"></span>
        </div>
        <div class="contact-info">
          <div class="contact-name">
            <span>${c.full_name || c.username}</span>
            ${badgeHtml}
          </div>
          <div class="contact-preview">${c.bio || '@' + c.username}</div>
        </div>
      </div>
    `;
  }).join('');
}

function filterContacts(query) {
  const q = query.toLowerCase();
  const filtered = allContacts.filter(c => 
    (c.full_name && c.full_name.toLowerCase().includes(q)) ||
    (c.username && c.username.toLowerCase().includes(q))
  );
  renderContactsList(filtered);
}

async function selectContact(contactId) {
  activeContactId = contactId;
  const contact = allContacts.find(c => c.id === contactId);
  if (!contact) return;

  document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
  const currentItem = document.getElementById(`contact-${contactId}`);
  if (currentItem) currentItem.classList.add('active');

  document.getElementById('noChatPlaceholder').style.display = 'none';
  const chatArea = document.getElementById('activeChatArea');
  chatArea.style.display = 'flex';

  const isDoc = isDocenteProfile(contact);
  document.getElementById('chatHeaderAvatar').src = contact.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
  document.getElementById('chatHeaderName').innerHTML = `
    <span>${contact.full_name || contact.username}</span>
    ${isDoc ? '<span class="badge-docente"><i class="fa-solid fa-crown"></i> Docente</span>' : '<span class="badge-alumno">Alumno</span>'}
  `;
  document.getElementById('chatHeaderProfileLink').href = `profile.html?id=${contact.id}`;

  await loadMessages();
}

async function loadMessages() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';

  const { data: messages, error } = await sb
    .from('messages')
    .select('*')
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeContactId}),and(sender_id.eq.${activeContactId},receiver_id.eq.${currentUser.id})`)
    .order('created_at', { ascending: true });

  if (error) {
    container.innerHTML = '<div class="empty-state"><p>Error al cargar mensajes.</p></div>';
    return;
  }

  renderMessages(messages || []);
}

function renderMessages(messages) {
  const container = document.getElementById('chatMessages');
  if (messages.length === 0) {
    container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-comments"></i><p>Inicia la conversación académica con tu compañero o docente.</p></div>';
    return;
  }

  container.innerHTML = messages.map(m => {
    const isMine = m.sender_id === currentUser.id;
    return `
      <div class="msg-row ${isMine ? 'mine' : ''}">
        <div class="msg-bubble">
          ${escapeHtml(m.content)}
        </div>
      </div>
    `;
  }).join('');

  container.scrollTop = container.scrollHeight;
}

async function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !activeContactId) return;

  input.value = '';
  const { error } = await sb.from('messages').insert({
    sender_id: currentUser.id,
    receiver_id: activeContactId,
    content: text
  });

  if (!error) {
    await loadMessages();
  }
}

function setupRealtimeMessages() {
  sb.channel('public:messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      const msg = payload.new;
      if (
        (msg.sender_id === activeContactId && msg.receiver_id === currentUser.id) ||
        (msg.sender_id === currentUser.id && msg.receiver_id === activeContactId)
      ) {
        loadMessages();
      }
    })
    .subscribe();
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
